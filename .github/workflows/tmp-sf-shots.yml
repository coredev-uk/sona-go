# TEMPORARY (removed before the pull request is ready): the macOS pictures of
# the SF Symbols change (#210 §6.2), from the ui.Tester rig on macos-26.
name: tmp SF Symbols shots
on:
  push:
    branches: [feature/slice-5-210-6-2-6-3-c769b4]
permissions:
  contents: read
jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-macos
        with:
          flavor: mac-race-ui-1
      - name: Theme tests (the symbols on this Mac)
        run: go test -count=1 -v -run 'Symbol|Glyph' ./internal/ui/theme
      - name: Pictures
        if: ${{ always() }}
        env:
          SONA_SHOTS: ${{ runner.temp }}/shots
        run: go test -count=1 -v -run TestSymbolShots ./internal/ui/app
      # actions/upload-artifact v7.0.2
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sf-shots
          path: ${{ runner.temp }}/shots
          retention-days: 3
