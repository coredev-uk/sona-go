# Checks for every push to main and every pull request; release.yml runs the
# Linux jobs (linux-only) before building a release. Pull requests run with `pull_request`
# (never `pull_request_target`): a fork's run gets a read-only GITHUB_TOKEN
# and no secrets, and no job here reads one (docs/security-review.md,
# "Workflows").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      linux-only:
        description: >-
          Skip the macOS and Windows jobs. release.yml sets it: Sona's
          releases are Linux packages, and a platform job that is not
          required must not hold one up.
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. On main every commit gets
# its own run: Clarence checks each merge commit's CI, and a shared group
# would drop a pending run whenever a newer commit lands, which Clarence reads
# as a failed merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go vet and test (-race)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MyGo's native UI (GTK3, the tray's appindicator, libsecret, EGL/GL
      # through epoxy; loaded at run time, the -dev packages give the tests
      # and the vet pass what they link), GStreamer for the playback host
      # and its tests (appsrc, avdec_aac, audioconvert, audioresample,
      # volume, fakesink), dbus for the session-bus tests, a font for the
      # UI's golden images (internal/ui, as in the "UI tests" job).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libepoxy-dev libgl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            fonts-dejavu-core dbus

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      # Paths that differ only by case break macOS and Windows checkouts.
      - name: Check path case
        run: go run ./cmd/pathcase

      # The macOS and Windows seams (CONTRIBUTING.md, "Platforms"): every
      # package must type-check there with cgo off until real macOS and
      # Windows runners build the app. cmd/typecheck checks Sona's packages
      # from source for macOS, where cgo is off (MyGo is pure Go there).
      - name: Type-check Windows (go vet, cgo off)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Type-check macOS (cgo off)
        run: go run ./cmd/typecheck -os darwin -arch arm64 ./...

      # Ubuntu 24.04's AppArmor creates unprivileged user namespaces without
      # capabilities, so the CDM host sandbox would get no mount namespace and
      # its tests would skip (they skip, with the reason, wherever namespaces
      # are refused). Lift the restriction so they run here; with
      # SONA_CDMHOST_REQUIRE_NAMESPACES set, a refusal fails them instead.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The real-CDM tests use Google's Widevine CDM, downloaded and verified
      # the way Sona does it (cmd/cdmfetch, internal/playback/cdm) and cached
      # per version: Mozilla's manifest names the version, so a new CDM
      # release fills a new cache entry. SONA_CDM_REQUIRE makes a test that
      # would skip for want of the CDM fail instead.
      - name: Resolve the Widevine CDM version
        id: cdm
        run: echo "version=$(go run ./cmd/cdmfetch -version)" >> "$GITHUB_OUTPUT"

      - name: Cache the Widevine CDM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sona-ci/widevine
          key: widevine-${{ runner.os }}-${{ runner.arch }}-${{ steps.cdm.outputs.version }}

      - name: Install the Widevine CDM
        run: |
          go run ./cmd/cdmfetch -dir ~/.cache/sona-ci/widevine
          echo "SONA_CDM_CACHE=$HOME/.cache/sona-ci/widevine" >> "$GITHUB_ENV"
          echo "SONA_CDM_REQUIRE=1" >> "$GITHUB_ENV"

      - name: CDM host sandbox tests (verbose, must not skip)
        env:
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
        run: go test -race -count=1 -v -run 'TestChildCannotOpenInetSockets|TestSandbox' ./internal/playback/cdmhost

      - name: Real Widevine CDM tests (verbose, must not skip)
        env:
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
        run: >-
          dbus-run-session -- go test -race -count=1 -v
          -run '^(TestCDM|TestProbe|TestSessionChallenge|TestPlayClearTrack|TestNextTrackAdvances|TestChildExit|TestChildCrashInBundle)$'
          ./internal/playback/widevine ./internal/playback/cdmhost ./internal/diag

      # Apple's 30-second previews through a host child with no CDM:
      # needs no MUSIC_USER_TOKEN, so it runs on every pull
      # request. SONA_PREVIEW_REQUIRE fails it instead of skipping when
      # Apple is unreachable.
      - name: Preview playback, no MUSIC_USER_TOKEN (verbose, must not skip)
        env:
          SONA_PREVIEW_REQUIRE: "1"
        run: dbus-run-session -- go test -race -count=1 -v -run '^TestPreviewPlaysLive$' ./internal/playback/native

      - name: go test -race
        env:
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
          SONA_PREVIEW_REQUIRE: "1"
        run: dbus-run-session -- go test -race ./...

  # The native UI's tests on their own, so a broken picture fails a check of
  # its own: the ui.Tester tests of internal/ui, which include the golden
  # images (the shell and Albums, light and dark; internal/ui/app/testdata).
  # They draw on MyGo's CPU renderer (MYGO_GPU=0) with no display. The golden
  # job's failure leaves the picture and a diff in the artifact.
  ui:
    name: UI tests (goldens)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      MYGO_GPU: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libepoxy-dev libgl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            fonts-dejavu-core dbus

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go test ./internal/ui/... (goldens)
        run: |
          mkdir -p "$RUNNER_TEMP/ui-artifacts"
          dbus-run-session -- go test -count=1 -artifacts -outputdir "$RUNNER_TEMP/ui-artifacts" ./internal/ui/...

      - name: Development and probe builds (vet, dev-only tests)
        run: |
          go vet -tags dev,sqlite_fts5 ./...
          go vet -tags probe,sqlite_fts5 ./...
          dbus-run-session -- go test -count=1 -tags dev,sqlite_fts5 ./internal/devinstance ./internal/ui/devstate ./internal/ui/app ./internal/app ./internal/mpris

      - name: Keep the pictures of a failed golden
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-golden-diffs
          path: ${{ runner.temp }}/ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

  # The built app from outside (e2e/): a probe build (MyGo's automation
  # plugin, a fake playback engine, a local server for the covers) on the
  # synthetic fixture profile, in a headless sway with private session and
  # AT-SPI buses (e2e/headless.sh), no network. It checks first paint, the
  # Albums page, playing an album, Space, a capture, and the shell's
  # landmarks on the accessibility bus.
  e2e-headless:
    name: E2E (headless sway)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app's own libraries as in the go job, plus the session e2e/headless.sh
      # builds: sway and wtype, the D-Bus daemon, AT-SPI (the bus launcher and
      # the registry, libatk-bridge for GTK), and software GL (llvmpipe) and a
      # font for MyGo to draw with.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev \
            libepoxy-dev libgl-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            sway wtype dbus dbus-daemon dbus-bin at-spi2-core libatk-bridge2.0-0t64 \
            libegl1 libegl-mesa0 libgl1-mesa-dri fonts-dejavu-core

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: E2E smoke and AT-SPI check
        run: e2e/headless.sh -- go test -tags e2e -count=1 -v ./e2e/...

      - name: Keep the capture and the app's log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: ${{ github.workspace }}/e2e-out
          if-no-files-found: ignore
          retention-days: 7

  # The macOS and Windows builds (CONTRIBUTING.md, "Platforms"). Hosted macOS
  # minutes cost ten times Linux's (Windows twice) while the repository is
  # private, so until it is public these run only when dispatched (Actions →
  # CI → Run workflow); once it is public, on every push and pull request.
  macos:
    name: macOS build and test
    # Not on pull requests: these jobs take several minutes and are not
    # required checks. They run after each merge to main and on demand
    # (workflow_dispatch), never from release.yml (linux-only).
    if: ${{ !inputs.linux-only && (github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && !github.event.repository.private)) }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: devenv shell -- bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain a contributor's Mac gets (CONTRIBUTING.md, "macOS"):
      # devenv from the nixpkgs revision devenv.yaml pins. The token only
      # lifts GitHub's API rate limit for fetching the inputs (read-only).
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ github.token }}

      - name: Install devenv
        shell: bash
        run: |
          rev=$(sed -n 's|.*github:NixOS/nixpkgs/||p' devenv.yaml)
          devenv=$(nix build --no-link --print-out-paths "github:NixOS/nixpkgs/$rev#devenv")
          echo "$devenv/bin" >> "$GITHUB_PATH"

      - name: Enter the devenv shell
        run: go version && gst-inspect-1.0 --version && echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET"

      # Every cgo object, nixpkgs library and the link itself must target the
      # same macOS (devenv.nix, MACOSX_DEPLOYMENT_TARGET); ld warns otherwise.
      # Go's module and build caches (devenv puts GOPATH under .devenv/state/go;
      # GOCACHE stays at macOS's default), so a run rebuilds only what changed.
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .devenv/state/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ runner.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-macos-${{ runner.arch }}-

      - name: Build bin/sona (production, no deployment-target warnings)
        run: |
          go build -tags mygo_noinspector,sqlite_fts5 -ldflags "-X main.version=$(cat VERSION) -X github.com/egoist/mygo.production=1" -o bin/sona ./cmd/sona 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep 'built for newer macOS version' "$RUNNER_TEMP/build.log"; then
            echo "::error::objects or libraries target a newer macOS than the link (devenv.nix, MACOSX_DEPLOYMENT_TARGET)"
            exit 1
          fi
          otool -l bin/sona | grep -A4 LC_BUILD_VERSION

      - name: go vet
        run: go vet ./...

      # The real-CDM tests, with the macOS CDM (mac_arm64) downloaded and
      # cached the way the Linux job does it.
      - name: Resolve the Widevine CDM version
        id: cdm
        run: echo "version=$(go run ./cmd/cdmfetch -version)" >> "$GITHUB_OUTPUT"

      - name: Cache the Widevine CDM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sona-ci/widevine
          key: widevine-${{ runner.os }}-${{ runner.arch }}-${{ steps.cdm.outputs.version }}

      - name: Install the Widevine CDM
        run: |
          go run ./cmd/cdmfetch -dir ~/.cache/sona-ci/widevine
          echo "SONA_CDM_CACHE=$HOME/.cache/sona-ci/widevine" >> "$GITHUB_ENV"

      - name: Real Widevine CDM and sandbox tests (verbose, must not skip)
        env:
          SONA_CDM_REQUIRE: "1"
        run: go test -count=1 -v -run '^(TestCDM|TestProbe|TestSessionChallenge|TestSeatbeltConfinesChild)$' ./internal/playback/widevine ./internal/playback/cdmhost

      - name: go test -race (no deployment-target warnings)
        run: |
          go test -race ./... 2>&1 | tee "$RUNNER_TEMP/test.log"
          if grep 'built for newer macOS version' "$RUNNER_TEMP/test.log"; then
            echo "::error::objects or libraries target a newer macOS than the link (devenv.nix, MACOSX_DEPLOYMENT_TARGET)"
            exit 1
          fi

  windows:
    name: Windows build
    # Not on pull requests: these jobs take several minutes and are not
    # required checks. They run after each merge to main and on demand
    # (workflow_dispatch), never from release.yml (linux-only).
    if: ${{ !inputs.linux-only && (github.event_name == 'workflow_dispatch' || (github.event_name != 'pull_request' && !github.event.repository.private)) }}
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # mattn/go-sqlite3 needs cgo: the runner's MinGW-w64 gcc. MyGo itself
      # is pure Go on Windows.
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: go vet (cgo on)
        run: gcc --version && go vet ./...

      - name: Build sona.exe
        run: |
          go build -tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false \
            -ldflags "-w -s -H windowsgui -X main.version=$(cat VERSION) -X github.com/egoist/mygo.production=1" -o bin/sona.exe ./cmd/sona
          ls -l bin/sona.exe
