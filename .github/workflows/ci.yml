# Checks for every push to main and every pull request; release.yml runs the
# same jobs before building a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go vet and test (-race)
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@v5

      # GTK4/WebKitGTK headers for the main package (cgo), GStreamer for the
      # playback host and its tests (appsrc, avdec_aac, audioconvert,
      # audioresample, volume, fakesink), dbus for the session-bus tests.
      # No Widevine CDM is configured: the runner image ships Google Chrome,
      # but the real-CDM tests run only when SONA_WIDEVINE_CDM is set.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            dbus

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # main.go embeds frontend/dist; the frontend job builds the real one.
      - name: Stub the embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/.ci

      - name: go vet
        run: go vet ./...

      # The macOS and Windows seams (CONTRIBUTING.md, "Platforms"): every
      # package must type-check there with cgo off until real macOS and
      # Windows runners build the app. Wails' macOS backend is Objective-C
      # behind cgo, so go vet stops there; cmd/typecheck checks Sona's
      # packages from source and only names Wails as needing cgo.
      - name: Type-check Windows (go vet, cgo off)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Type-check macOS (cgo off)
        run: go run ./cmd/typecheck -os darwin -arch arm64 ./...

      # Ubuntu 24.04's AppArmor creates unprivileged user namespaces without
      # capabilities, so the CDM host sandbox would get no mount namespace and
      # its tests would skip (they skip, with the reason, wherever namespaces
      # are refused). Lift the restriction so they run here; with
      # SONA_CDMHOST_REQUIRE_NAMESPACES set, a refusal fails them instead.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: CDM host sandbox tests (verbose, must not skip)
        env:
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
        run: go test -race -count=1 -v -run 'TestChildCannotOpenInetSockets|TestSandbox' ./internal/playback/cdmhost

      - name: go test -race
        env:
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
        run: dbus-run-session -- go test -race ./...

  frontend:
    name: Frontend typecheck, lint, format, test, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Paths or module names that differ only by case break macOS checkouts.
      - run: node scripts/check-path-case.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec eslint src
      - run: pnpm exec prettier --check src
      - run: pnpm exec vitest run
      - run: pnpm run build
