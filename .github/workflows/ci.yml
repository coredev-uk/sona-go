# Checks for every push to main and every pull request; release.yml runs the
# Linux jobs (linux-only) before building a release. Pull requests run with `pull_request`
# (never `pull_request_target`): a fork's run gets a read-only GITHUB_TOKEN
# and no secrets, and no job here reads one (docs/security-review.md,
# "Workflows").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: every package under -race, tests rerun (-count=1) so the test
  # cache can't hide what changed outside the code (the image, the network).
  schedule:
    - cron: "23 3 * * *"
  workflow_call:
    inputs:
      linux-only:
        description: >-
          Skip the macOS and Windows jobs. release.yml sets it: it builds
          and smoke-tests those platforms itself (build/darwin,
          build/windows), and a development build job that is not required
          must not hold a release up.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Which jobs to run: all (what a push to main runs), pr (what a pull
          request runs), macos, windows, uiprobe or orca
        type: choice
        options: [all, pr, macos, windows, uiprobe, orca]
        default: all

permissions:
  contents: read

# bash everywhere (macOS included) runs with -eo pipefail, so a failing
# command in a pipeline fails the step.
defaults:
  run:
    shell: bash

# A pull request's newer push cancels its older run. On main every commit gets
# its own run: Clarence checks each merge commit's CI, and a shared group
# would drop a pending run whenever a newer commit lands, which Clarence reads
# as a failed merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# How the work is spread (CONTRIBUTING.md, "CI and workflows"): every check
# still runs, including the golden images; a pull request runs -race on the
# packages that start goroutines, main and the nightly on all of them. Each
# test runs once and the jobs run side by side. The test jobs take their packages from
# .github/ci/shard.sh (packed by measured time, .github/ci/timings.txt); Go's
# build and test caches come from the last run on main; the system packages'
# .debs are cached. The five required checks keep their names: where a job is
# a matrix, a small job of the required name gathers its results.
jobs:
  # What changed. A documentation-only pull request skips the heavy jobs; the
  # required checks still report, because a job skipped by `if` counts as
  # passed (a workflow-level `paths-ignore` would leave them pending).
  changes:
    name: Changed files
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.files.outputs.heavy }}
      ui-matrix: ${{ steps.files.outputs.ui-matrix }}
    steps:
      - name: Does the change reach the code?
        id: files
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ inputs.only }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          heavy=true
          # A dispatch that names only the macOS, Windows or probe jobs (release.yml's
          # call has no `only`).
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$ONLY" ] && [ "$ONLY" != all ] && [ "$ONLY" != pr ]; then
            heavy=false
          fi
          if [ "$EVENT" = pull_request ]; then
            if files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)'); then
              if ! grep -qvE '^(docs/.*|[^ ]*\.md)$' <<<"$files"; then
                heavy=false
              fi
            fi
          fi
          echo "heavy=$heavy" >>"$GITHUB_OUTPUT"
          echo "heavy: $heavy"
          # The UI shards (shard.sh pools: ui-race holds the packages that
          # start goroutines, ui the rest). A pull request runs ui without
          # -race and ui-race with it; main and the nightly run everything
          # under -race, and ui also without it, which keeps the caches the
          # pull requests restore warm. The same pool, shard count and mode
          # make the same cache flavor, so a pull request restores what main
          # saved. The -race run of ui has three shards: with two, the heavier
          # one took 8–9 min of its 10 and was cancelled at the limit on
          # 293aa54 (2026-11-07), which reverted a change that never touched
          # the UI.
          ui='{"pool":"ui","index":1,"count":2,"race":"0"},{"pool":"ui","index":2,"count":2,"race":"0"},{"pool":"ui-race","index":1,"count":1,"race":"1"}'
          if [ "$EVENT" != pull_request ] && [ "$ONLY" != pr ]; then
            ui="$ui"',{"pool":"ui","index":1,"count":3,"race":"1"},{"pool":"ui","index":2,"count":3,"race":"1"},{"pool":"ui","index":3,"count":3,"race":"1"}'
          fi
          echo "ui-matrix=[$ui]" >>"$GITHUB_OUTPUT"

  # The image the Linux jobs below run in (build/ci/Containerfile, published
  # by images.yml). The tag follows the Containerfile and go.mod; a change to
  # either on a branch of this repository is built by the Images workflow in
  # parallel, and this job waits for it. The jobs pin the digest found here,
  # so the weekly rebuild never changes a run in progress, and the digest
  # keys Go's caches.
  image:
    name: CI image
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'uiprobe' || inputs.only == 'orca')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read # pull the image
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      id: ${{ steps.find.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the image
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: build/ci/find-image.sh

  # go vet for the host, the development build (-tags dev) and the probe build
  # (-tags probe), then the macOS and Windows seams (CONTRIBUTING.md,
  # "Platforms"): every package must type-check there with cgo off, which needs
  # no system packages, and paths that differ only by case break macOS and
  # Windows checkouts. The steps share compiled dependencies, so one job beats
  # several that each compile them.
  vet:
    name: Vet and type-check
    needs: [changes, image]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MyGo loads GTK, libepoxy and the tray by soname at run time (purego):
      # building and vetting need only GStreamer's headers.
      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: none
          flavor: vet

      - name: go vet
        run: go vet ./...

      - name: go vet (development build)
        run: go vet -tags dev,sqlite_fts5 ./...

      - name: go vet (probe build)
        run: go vet -tags probe,sqlite_fts5 ./...

      - name: Check path case
        run: go run ./cmd/pathcase

      - name: Type-check Windows (go vet, cgo off)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go vet ./...

      # cmd/typecheck checks Sona's packages from source for macOS, where cgo
      # is off (MyGo is pure Go there).
      - name: Type-check macOS (cgo off)
        run: go run ./cmd/typecheck -os darwin -arch arm64 ./...

      - name: Save Go's caches
        if: ${{ always() && steps.setup.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # The tests, split into shards of packages (shard.sh). A pull request runs
  # the goroutine-heavy packages under -race and the rest without; main and
  # the nightly run everything under -race (the `race` of each matrix row; the
  # rows come from the changes job).
  #
  # The native UI's tests: the ui.Tester tests of internal/ui, which include the
  # golden images (the shell and Albums, light and dark;
  # internal/ui/app/testdata), and the dev-only tests of its packages (-tags
  # dev). They draw on MyGo's CPU renderer (MYGO_GPU=0) with no display. A
  # golden's failure leaves the picture and a diff in the ui-golden-diffs
  # artifact. These shards are the "UI tests (goldens)" check.
  test-ui:
    name: Tests, UI (${{ matrix.pool }} ${{ matrix.index }}/${{ matrix.count }}${{ matrix.race == '1' && ', race' || '' }})
    needs: [changes, image]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.ui-matrix) }}
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      MYGO_GPU: "0"
      TEST_FLAGS: ${{ github.event_name == 'schedule' && '-count=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: none
          flavor: ui-${{ matrix.pool }}-${{ matrix.index }}of${{ matrix.count }}-${{ matrix.race == '1' && 'race' || 'norace' }}

      - name: go test (UI shard)
        env:
          POOL: ${{ matrix.pool }}
          INDEX: ${{ matrix.index }}
          COUNT: ${{ matrix.count }}
          RACE: ${{ matrix.race }}
        run: .github/ci/session-bus.sh .github/ci/test.sh "$POOL" "$INDEX" "$COUNT"

      - uses: ./.github/actions/finish-tests
        if: ${{ always() }}
        with:
          artifact: test-results-ui-${{ matrix.pool }}-${{ matrix.index }}-${{ matrix.race }}
          check: ${{ job.status == 'success' }}

      - name: Keep the pictures of a failed golden
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-golden-diffs-${{ matrix.pool }}-${{ matrix.index }}-${{ matrix.race }}
          path: ${{ runner.temp }}/ui-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Go's caches
        if: ${{ always() && steps.setup.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # Everything that is neither UI nor playback: services, the database,
  # authentication, the dev-only tests of internal/app, internal/mpris and
  # internal/devinstance.
  test-core:
    name: Race tests, core
    needs: [changes, image]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        index: [1]
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      SHARDS: "1"
      TEST_FLAGS: ${{ github.event_name == 'schedule' && '-count=1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: none
          flavor: race-core-${{ matrix.index }}

      - name: go test -race (core shard)
        env:
          INDEX: ${{ matrix.index }}
        run: .github/ci/session-bus.sh .github/ci/test.sh core "$INDEX" "$SHARDS"

      - uses: ./.github/actions/finish-tests
        if: ${{ always() }}
        with:
          artifact: test-results-core-${{ matrix.index }}
          check: ${{ job.status == 'success' }}

      - name: Save Go's caches
        if: ${{ always() && steps.setup.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # The playback packages, which need the real Widevine CDM, user namespaces,
  # Apple's previews, GStreamer's H.264 codecs and a PipeWire daemon. They
  # always run (-count=1). Every test job runs skips.sh: a skipped test the
  # allow-list (.github/ci/skips-linux.txt) does not name is a missing
  # prerequisite, not a pass.
  test-playback:
    name: Race tests, playback
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          flavor: race-playback

      # Ubuntu 24.04's AppArmor creates unprivileged user namespaces without
      # capabilities, so the CDM host sandbox would get no mount namespace and
      # its tests would skip. Lift the restriction so they run here; with
      # SONA_CDMHOST_REQUIRE_NAMESPACES set, a refusal fails them instead.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The real-CDM tests use Google's Widevine CDM, downloaded and verified
      # the way Sona does it (cmd/cdmfetch, internal/playback/cdm). The cache
      # is renewed weekly; cdmfetch asks Mozilla's manifest for the version
      # every run and downloads a newer CDM over the cached one.
      - uses: ./.github/actions/setup-cdm
        with:
          key: week

      - name: go test -race (playback packages)
        env:
          SONA_CDM_REQUIRE: "1"
          SONA_CDMHOST_REQUIRE_NAMESPACES: "1"
          SONA_PREVIEW_REQUIRE: "1"
          TEST_FLAGS: -count=1
        run: dbus-run-session -- .github/ci/with-pipewire.sh .github/ci/test.sh playback 1 1

      - uses: ./.github/actions/finish-tests
        if: ${{ always() }}
        with:
          artifact: test-results-playback
          check: ${{ job.status == 'success' }}

      - name: Save Go's caches
        if: ${{ always() && steps.setup.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # The required check of this name: vet, the type-checks and every test shard
  # but the UI's. Skipped jobs (a documentation-only change) pass.
  go:
    name: Go vet and test (-race)
    needs: [changes, image, vet, test-core, test-playback]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The required check of this name: the UI shards, goldens included.
  ui:
    name: UI tests (goldens)
    needs: [changes, image, test-ui]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  # The built app from outside (e2e/): a probe build (MyGo's automation
  # plugin, a fake playback engine, a local server for the covers) on the
  # synthetic fixture profile, in a headless sway with private session and
  # AT-SPI buses (e2e/headless.sh), no network. It checks first paint, the
  # Albums page, playing an album, Space, a capture, and the shell's
  # landmarks on the accessibility bus. Only this job builds the probe binary.
  e2e-headless:
    name: E2E (headless sway)
    needs: [changes, image]
    if: ${{ needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app's own libraries, plus the session e2e/headless.sh builds: sway
      # and wtype, the D-Bus daemon, AT-SPI (the bus launcher and the
      # registry, libatk-bridge for GTK), and software GL (llvmpipe) and a
      # font for MyGo to draw with.
      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: none
          flavor: e2e

      - name: E2E smoke and AT-SPI check
        run: e2e/headless.sh -- go test -tags e2e -count=1 -v ./e2e/...

      - name: Keep the capture and the app's log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-out
          path: ${{ github.workspace }}/e2e-out
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Go's caches
        if: ${{ always() && steps.setup.outputs.save == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # A real Orca walked through the app (e2e/orca_walk_test.go) in the same
  # headless sway as the e2e job: Tab and the arrows through the sidebar, a
  # library page, an album, Now Playing, the queue, the account dialog and the
  # first-run setup, and what Orca says for each, from its debug log (it logs
  # every utterance, so no audio is needed), checked against
  # docs/accessibility.md. Run by hand (workflow_dispatch, only=orca or all),
  # never on a pull request or a push, and not a required check: it depends on
  # Orca's own speech and timing, which change with its version.
  #
  # It runs in the CI image like the e2e and probe jobs: a run on a bare
  # runner installed the GTK and GStreamer stack and built with a cold Go cache
  # every time, because a job that only runs by hand finds the runner image
  # changed since its caches were saved. Only Orca (and procps) is installed
  # on top of the image, its .debs cached per image; Go's caches are the e2e
  # job's (same build), restored and not saved.
  orca-walk:
    name: Orca walk (headless sway)
    needs: [changes, image]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'orca') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      E2E_OUT: ${{ github.workspace }}/orca-out
      E2E_ORCA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The e2e job's Go caches (same build), and Orca on top of the image.
      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: orca
          flavor: e2e

      - name: Walk the app with Orca
        run: e2e/headless.sh -- go test -tags e2e -count=1 -v -run '^TestOrca' -timeout 10m ./e2e/

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## What Orca said (headless sway, fixture profile)"
            for f in orca-walk orca-setup; do
              echo
              echo "### $f"
              cat "$E2E_OUT/$f.md" 2>/dev/null || echo "not heard"
            done
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep Orca's log and the app's
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orca-out
          path: ${{ github.workspace }}/orca-out
          if-no-files-found: ignore
          retention-days: 7

  # The native UI's numbers after a merge (plan §15): the Albums scroll table,
  # first paint over 5 starts, PSS and idle CPU, from cmd/uiprobe against the
  # probe build in the same headless sway as the e2e job, on the fixture
  # profile. Posted as the job summary. Not on pull requests. The probe has no
  # motion-artwork scenario yet, so motion CPU is not reported. The headless
  # session draws on the CPU (llvmpipe/pixman): compare runs with each other,
  # not with a desktop GPU.
  uiprobe:
    name: UI probe (headless sway)
    needs: [changes, image]
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'uiprobe')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read # pull the image
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      SONA_CI_IMAGE: ${{ needs.image.outputs.id }}
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
      E2E_OUT: ${{ github.workspace }}/uiprobe-out
      E2E_UIPROBE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The e2e job's caches (same build); this job only restores them.
      - uses: ./.github/actions/setup-linux
        id: setup
        with:
          packages: none
          flavor: e2e

      - name: Measure
        run: e2e/headless.sh -- go test -tags e2e -count=1 -v -run '^TestUIProbe$' -timeout 20m ./e2e/...

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## UI probe (headless sway, software rendering)"
            echo
            echo "### First paint"
            cat "$E2E_OUT/uiprobe-firstpaint.md" 2>/dev/null || echo "not measured"
            echo
            echo "### Albums scroll, PSS and idle CPU"
            echo
            cat "$E2E_OUT/uiprobe-albums.md" 2>/dev/null || echo "not measured"
            echo
            echo "Motion artwork CPU: not measured (uiprobe has no motion scenario yet)."
            echo
            echo '<details><summary>uiprobe stderr</summary>'
            echo
            echo '```'
            cat "$E2E_OUT/uiprobe-albums-stderr.txt" 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the tables and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uiprobe-out
          path: ${{ github.workspace }}/uiprobe-out
          if-no-files-found: ignore
          retention-days: 14

  # The macOS and Windows builds (CONTRIBUTING.md, "Platforms"). They run
  # after a merge to main and when dispatched (Actions → CI → Run workflow);
  # a pull request that reaches the code runs the macOS build too, and nothing
  # of either runs from release.yml (linux-only: it builds the release
  # artefacts of each platform itself). macOS uses the official GStreamer
  # packages release.yml's build uses, not devenv: entering the devenv shell
  # took twelve minutes of the job.
  # GitHub runs at most five macOS jobs at a time for the whole account (every
  # repository's), so a push to main or a pull request runs one: this one (the
  # production build, go vet, and the core and playback tests with the real
  # CDM and Seatbelt, so a change that breaks the Mac is seen before it
  # merges). The UI shards below run on macOS only in the nightly and on
  # dispatch; the same tests run on Linux on every push. Five jobs a push took
  # every slot, and two merges in a row, or a merge while another repository
  # built on macOS, queued for half an hour.
  # A push, the nightly and a dispatch do not wait for `changes`; a pull request
  # runs it only when the change reaches the code (a documentation-only one
  # skips it). It saves Go's caches on main and on dispatch, and restores them
  # in a pull request.
  macos-build:
    name: macOS build, vet, core and playback tests
    needs: changes
    if: ${{ !cancelled() && !inputs.linux-only && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'macos')) || (!github.event.repository.private && ((github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch') || (needs.changes.outputs.heavy == 'true' && (github.event_name == 'pull_request' || inputs.only == 'pr'))))) }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos
        id: setup
        with:
          flavor: mac-race-core-1

      # Every cgo object and the link itself must target the same macOS
      # (build/darwin/MIN_MACOS, exported by setup-macos); ld warns otherwise.
      - name: Build bin/sona (production, no deployment-target warnings)
        run: |
          go build -tags mygo_noinspector,sqlite_fts5 -ldflags "$(build/ldflags.sh --goos darwin --no-credentials)" -o bin/sona ./cmd/sona 2>&1 | tee "$RUNNER_TEMP/build.log"
          .github/ci/no-deploy-warnings.sh "$RUNNER_TEMP/build.log"
          otool -l bin/sona | grep -A4 LC_BUILD_VERSION

      - name: go vet
        run: go vet ./...

      # The playback tests run the real-CDM and sandbox tests with the macOS
      # CDM (mac_arm64), which the job downloads and caches as Linux's does.
      - uses: ./.github/actions/setup-cdm

      - name: go test -race (core, playback)
        env:
          SONA_CDM_REQUIRE: "1"
        run: |
          .github/ci/test.sh core 1 1 2>&1 | tee "$RUNNER_TEMP/test.log"
          TEST_FLAGS=-count=1 .github/ci/test.sh playback 1 1 2>&1 | tee -a "$RUNNER_TEMP/test.log"
          .github/ci/no-deploy-warnings.sh "$RUNNER_TEMP/test.log"

      - uses: ./.github/actions/finish-tests
        if: ${{ always() }}
        with:
          artifact: test-results-macos-core-playback
          check: ${{ job.status == 'success' }}

      - name: Save Go's caches
        if: ${{ always() && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  # The UI packages' `go test -race` on macOS, in two shards (shard.sh): the
  # nightly and a dispatch only (see macos-build).
  macos-test:
    name: macOS tests (${{ matrix.pool }} ${{ matrix.index }}/${{ matrix.count }})
    if: ${{ !inputs.linux-only && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'macos')) || (github.event_name == 'schedule' && !github.event.repository.private)) }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pool: ui, index: 1, count: 2 }
          - { pool: ui, index: 2, count: 2 }
    env:
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-macos
        id: setup
        with:
          flavor: mac-race-${{ matrix.pool }}-${{ matrix.index }}

      - name: go test -race (no deployment-target warnings)
        env:
          POOL: ${{ matrix.pool }}
          INDEX: ${{ matrix.index }}
          COUNT: ${{ matrix.count }}
        run: |
          .github/ci/test.sh "$POOL" "$INDEX" "$COUNT" 2>&1 | tee "$RUNNER_TEMP/test.log"
          .github/ci/no-deploy-warnings.sh "$RUNNER_TEMP/test.log"

      - uses: ./.github/actions/finish-tests
        if: ${{ always() }}
        with:
          artifact: test-results-macos-${{ matrix.pool }}-${{ matrix.index }}
          check: ${{ job.status == 'success' }}

      - name: Save Go's caches
        if: ${{ always() && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-path }}
          key: ${{ steps.setup.outputs.cache-key }}

  macos:
    name: macOS build and test
    needs: [macos-build, macos-test]
    if: ${{ always() && !inputs.linux-only && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'macos')) || (github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && !github.event.repository.private)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null

  windows:
    name: Windows build
    # As the macOS jobs: after a merge to main and on demand only.
    if: ${{ !inputs.linux-only && ((github.event_name == 'workflow_dispatch' && (inputs.only == 'all' || inputs.only == 'windows')) || (github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch' && !github.event.repository.private)) }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      # mattn/go-sqlite3 needs cgo: the runner's MinGW-w64 gcc. MyGo itself
      # is pure Go on Windows.
      CGO_ENABLED: "1"
      GOFLAGS: -tags=sqlite_fts5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Where Go's caches are
        id: dirs
        run: |
          echo "build=$(go env GOCACHE)" >>"$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >>"$GITHUB_OUTPUT"

      # The key follows install-gstreamer.sh too: Go reuses a linked test binary
      # from its cache without noticing that cgo's link flags changed.
      - name: Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.dirs.outputs.build }}
            ${{ steps.dirs.outputs.mod }}
          key: go-windows-${{ hashFiles('go.mod', 'go.sum', 'build/windows/install-gstreamer.sh') }}-${{ github.run_id }}
          restore-keys: go-windows-${{ hashFiles('go.mod', 'go.sum', 'build/windows/install-gstreamer.sh') }}-

      # The official GStreamer packages (cgo links them) and the CDM shim DLL
      # (built with MSVC, the ABI of Google's CDM).
      - uses: ./.github/actions/setup-windows

      - name: go vet (cgo on)
        run: gcc --version && go vet ./...

      - name: Build sona.exe
        run: |
          go build -tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false \
            -ldflags "$(build/ldflags.sh --goos windows --no-credentials)" -o bin/sona.exe ./cmd/sona
          ls -l bin/sona.exe

      - name: Build playspike.exe
        run: go build -trimpath -buildvcs=false -o bin/playspike.exe ./cmd/playspike

      # The program must start: GStreamer's DLLs resolve and the link is sound.
      - name: playspike starts
        run: |
          out=$(bin/playspike.exe -h 2>&1 || true)
          printf '%s\n' "$out" | head -n 6
          grep -q 'Usage of' <<<"$out"
          "$PKG_CONFIG" --libs gstreamer-1.0 gstreamer-app-1.0

      # The pipeline end to end with no secret: two 30-second previews (the
      # developer token only: no Music User Token, no CDM) through the engine,
      # the host child and GStreamer's decoders, to fakesink. This build
      # links the installed GStreamer; the packaged one is smoke-tested by
      # release.yml (build/windows/smoke.sh). It needs Apple's catalogue and
      # clips over the network, which a runner now and then cannot reach:
      # playspike ends with status 75 when the network failed (cmd/playspike,
      # networkError) and 1 when the player did, so only a 75 is run again,
      # up to four attempts with a growing wait between them. Any other
      # failure, or a fourth 75, fails the step.
      - name: Preview playback (fakesink)
        env:
          SONA_PRIVATE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/preview" # no .env to find
          cd "$RUNNER_TEMP/preview"
          unset MUSIC_USER_TOKEN SONA_CDM_SHIM
          attempts=4
          for attempt in $(seq 1 "$attempts"); do
            rc=0
            timeout 600 "$GITHUB_WORKSPACE/bin/playspike.exe" -preview -sink fakesink -storefront us >preview.out 2>&1 || rc=$?
            cat preview.out
            if [ "$rc" -ne 75 ] || [ "$attempt" -eq "$attempts" ]; then break; fi
            wait=$((20 * 3 ** (attempt - 1)))
            echo "::warning title=Preview playback::the network failed (attempt $attempt of $attempts); trying again in ${wait}s"
            sleep "$wait"
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Preview playback::playspike exited with status $rc (75: the network failed on every attempt)"
            exit 1
          fi
          grep -q 'preview advancing' preview.out
          grep -q 'next preview playing' preview.out

      # Motion artwork plays through Windows' own Media Foundation (MyGo's
      # ui/video, internal/ui/media), no GStreamer: a generated H.264 clip
      # (x264enc, from the installed GStreamer's gst-launch-1.0) is opened the
      # way MotionCover does, becomes Ready once a ui.Video builds it, shows a
      # moving picture and loops. The test also logs what the PR reports: the
      # open and first-picture time over five opens, and the gap at the loop
      # point. A skipped test fails the step: a runner with no Media
      # Foundation must not read as a pass. Only the test of a platform with no
      # decoder, and the one that needs a file of the motion cache, may skip.
      - name: Motion artwork (Media Foundation) tests
        run: |
          .github/ci/strict-test.sh "$RUNNER_TEMP/media.log" --lines 120 \
            --pass TestOpenMotion --pass TestOpenMotionOfAFileThatIsNotAVideo \
            --pass TestNativePlaysAndLoops --pass TestNativeOpenTime \
            --allow-skip 'TestOpenMotionWithoutDecoder|TestMotionFileOfTheCache' \
            -- go test -count=1 -timeout 10m -v ./internal/ui/media/

      # Google's CDM, downloaded and verified the way Sona does, loaded
      # through the shim DLL (SONA_CDM_SHIM, set by setup-windows).
      - name: CDM tests
        env:
          SONA_CDM_REQUIRE: "1"
        run: go test -count=1 -timeout 10m ./internal/playback/widevine/ ./internal/playback/cdm/...

      # The CDM host child's AppContainer sandbox (docs/security-review.md,
      # "Windows sandbox"): a probe child and the host run in it. With
      # SONA_CDMHOST_REQUIRE_SANDBOX set, a runner that refuses AppContainers
      # fails these instead of skipping them, and a skip fails the step.
      - name: Sandbox tests
        env:
          SONA_CDM_REQUIRE: "1"
          SONA_CDMHOST_REQUIRE_SANDBOX: "1"
        run: |
          .github/ci/strict-test.sh "$RUNNER_TEMP/sandbox.log" --skips \
            -- go test -count=1 -timeout 15m -v -run 'AppContainer|SandboxedHost|SandboxLoadsCDM|SandboxGaps|GrantAccess|RemoveSandbox|ReadFolders|EnvHelpers' \
            ./internal/playback/cdmhost/

      # The host child, GStreamer and the engine on Windows, against fakesink
      # and the real CDM.
      - name: Host and engine tests
        env:
          SONA_CDM_REQUIRE: "1"
          SONA_CDMHOST_REQUIRE_SANDBOX: "1"
        run: |
          rc=0
          .github/ci/strict-test.sh "$RUNNER_TEMP/cdmhost.log" -- go test -count=1 -timeout 10m -v ./internal/playback/cdmhost/ || rc=1
          go test -count=1 -timeout 20m ./internal/playback/gst/ ./internal/playback/native/ ./internal/playback/gstbundle/ || rc=1
          exit $rc
