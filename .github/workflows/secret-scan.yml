name: Secret scan

# gitleaks with .gitleaks.toml (its default rules plus Sona's: JWT and Music
# User Token shapes, Last.fm and Discord credentials, credential files) over
# every commit of every branch and tag (all of them public), including the
# pull request's own commits, and over the pull request's title and body,
# which stay public and can't be rewritten later. The log shows each
# finding's rule and location only: gitleaks' own output, even with
# --redact, prints the rest of the line around a secret, and this log is
# public. docs/security-review.md, "Secret scanning".

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the
      # release's gitleaks_${GITLEAKS_VERSION}_checksums.txt. Update both
      # together.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      # gitleaks runs `git log --all`: every branch and tag fetched above and,
      # for a pull request, GitHub's merge commit, so each of the pull
      # request's commits too (they stay public through the pull request after
      # a squash merge).
      - name: Scan every commit
        run: |
          report="$RUNNER_TEMP/gitleaks-git.json"
          status=0
          gitleaks git --config .gitleaks.toml --redact --no-banner --report-format json --report-path "$report" . || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::\(.RuleID) in commit \(.Commit[0:12]) (\(.File):\(.StartLine))"' "$report"
          fi
          exit "$status"

      # Read from the event payload, not through `env:`: the runner prints a
      # step's env in the log.
      - name: Scan the pull request title and body
        if: github.event_name == 'pull_request'
        run: |
          dir="$RUNNER_TEMP/pull-request"
          report="$RUNNER_TEMP/gitleaks-pr.json"
          mkdir -p "$dir"
          jq -r '.pull_request.title, "", (.pull_request.body // "")' "$GITHUB_EVENT_PATH" > "$dir/pull-request.md"
          status=0
          gitleaks dir --config .gitleaks.toml --redact --no-banner --report-format json --report-path "$report" "$dir" || status=$?
          if [ -s "$report" ]; then
            jq -r '.[] | "::error::\(.RuleID) in the pull request \(if .StartLine <= 1 then "title" else "body, line \(.StartLine - 2)" end)"' "$report"
          fi
          exit "$status"
