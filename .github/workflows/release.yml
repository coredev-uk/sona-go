# Called by release-please.yml when merging a release PR has tagged
# v<VERSION> and created its draft GitHub release: runs the CI checks, builds
# the .deb/.rpm/Arch/AppImage packages on the Ubuntu 24.04 baseline with
# build/linux/release/release.sh (which smoke-tests each on a clean Ubuntu,
# Fedora and Arch container), then uploads the packages, the AppImage .zsync,
# the AUR sona-bin files and SHA256SUMS to the draft and publishes it.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<VERSION>) whose draft release receives the packages
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    # The Last.fm key and secret and the Discord application ID are secrets
    # of the `release` environment, which only runs from main and `v*` tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Tag matches VERSION
        env:
          TAG: ${{ inputs.tag }}
        run: |
          want="v$(cat VERSION)"
          if [ "$TAG" != "$want" ]; then
            echo "::error::tag $TAG does not match VERSION ($want)"
            exit 1
          fi

      # Podman is preinstalled on the runner image. The release secrets are
      # optional; without them Sona reads the same variables at runtime.
      - name: Build and smoke-test packages
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
        run: bash build/linux/release/release.sh "$RUNNER_TEMP/release"

      # release-please wrote the notes into the draft; publishing it makes it
      # the latest release, which the update notice and AppImageUpdate read.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            sona_*.deb sona-*.rpm sona-*.pkg.tar.zst sona-*.AppImage sona-*.AppImage.zsync \
            sona-bin-*-aur.tar.gz SHA256SUMS
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sona ${TAG#v}" \
            --draft=false \
            --latest
