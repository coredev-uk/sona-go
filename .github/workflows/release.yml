# Tag v<VERSION> (e.g. `git tag v0.1.0 && git push origin v0.1.0`): runs the
# CI checks, builds the .deb/.rpm/Arch/AppImage packages on the Ubuntu 24.04
# baseline with build/linux/release/release.sh (which smoke-tests each on a
# clean Ubuntu, Fedora and Arch container), then publishes a GitHub release
# with the packages, the AppImage .zsync, the AUR sona-bin files and
# SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    # The Last.fm key and secret and the Discord application ID are secrets
    # of the `release` environment, which only runs from main and `v*` tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches VERSION
        run: |
          want="v$(cat VERSION)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want)"
            exit 1
          fi

      # Podman is preinstalled on the runner image. The release secrets are
      # optional; without them Sona reads the same variables at runtime.
      - name: Build and smoke-test packages
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
        run: bash build/linux/release/release.sh "$RUNNER_TEMP/release"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/release"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Sona ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            sona_*.deb sona-*.rpm sona-*.pkg.tar.zst sona-*.AppImage sona-*.AppImage.zsync \
            sona-bin-*-aur.tar.gz SHA256SUMS
