# Sona's release, all platforms. Called by release-please.yml when merging a
# release PR has tagged v<VERSION> and created its draft GitHub release, and
# dispatched by hand for test builds:
#
#   plan      what this run is: a release of the tag, a prerelease build, or a
#             dry run, and the version in the binaries and file names
#   checks    the Linux CI jobs (ci.yml, linux-only: macOS and Windows build below)
#   linux     the .deb/.rpm/Arch/AppImage packages on the Ubuntu 24.04 baseline
#             with build/linux/release/release.sh (SHA256SUMS, smoke tests on
#             clean Ubuntu, Fedora and Arch containers), then build provenance
#   macos     Sona.app for Apple silicon with GStreamer bundled and ad-hoc
#             signed, its .dmg and the update archive (build/darwin), smoke-tested
#   windows   the x64 portable .zip, the per-user installer and the update
#             archive (build/windows), smoke-tested
#   publish   signs the update manifests (update-<target>.json) with the
#             SONA_UPDATE_KEY secret, writes one SHA256SUMS over everything,
#             attests it, uploads and publishes, as the bot-cecil GitHub App
#
# The notes in a tag's draft are release-please's changelog entry; publishing
# keeps them and appends .github/release-notes/install.md. The version in the
# binaries and in the file names is VERSION's, and the tag must equal it.
#
# Dispatching it (Actions → Release → Run workflow):
#   - with `prerelease` empty is the dry run: it builds and smoke-tests every
#     platform, attaches the files to the run as the linux-release,
#     macos-release and windows-release artifacts, and publishes, signs and
#     attests nothing. It runs without the `release` environment, so the
#     builds have no Last.fm or Discord credentials.
#   - with `prerelease` set (rc.1, rc.2, …) builds v<VERSION>-<prerelease> from
#     the branch, signs the manifests and publishes a GitHub prerelease, which
#     only installs with Settings → Updates → Test versions on. It runs in the
#     `release` environment, whose branch rules decide where it may run.
# Without the SONA_UPDATE_KEY secret (forks, a run outside the environment)
# the signing step is skipped, says so in the run summary, and the release has
# no update-<target>.json: those installs do not self-update.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<VERSION>) whose draft release receives the files
        required: true
        type: string
    secrets:
      RENOVATE_APP_CLIENT_ID:
        description: bot-cecil GitHub App client ID
        required: true
      RENOVATE_APP_PRIVATE_KEY:
        description: bot-cecil GitHub App private key
        required: true
  workflow_dispatch:
    inputs:
      checks:
        description: Run the Linux CI checks first (the branch's own CI normally covers them)
        type: boolean
        default: false
      prerelease:
        description: "Publish a prerelease v<VERSION>-<this> (rc.1, rc.2, …); empty is a dry run that publishes nothing"
        type: string
        default: ""

permissions:
  contents: read

# One release run per tag (per ref for a dry run); a second never cancels a
# first that is already uploading.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # A release is VERSION at its tag, which must equal the tag. A
      # prerelease is VERSION-<input> from the dispatched ref (the release PR's
      # branch while testing the next version). A dry run is VERSION.
      - name: Work out the version and what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          base=$(cat VERSION)
          if [ "$EVENT" != workflow_dispatch ]; then
            if [ "$TAG" != "v$base" ]; then
              echo "::error::tag $TAG does not match VERSION (v$base)"
              exit 1
            fi
            version=$base tag=$TAG publish=true prerelease=false
          elif [ -n "$PRERELEASE" ]; then
            if ! printf '%s' "$PRERELEASE" | grep -Eq '^[a-z]+\.[0-9]+$'; then
              echo "::error::prerelease must look like rc.1, got '$PRERELEASE'"
              exit 1
            fi
            version=$base-$PRERELEASE tag=v$base-$PRERELEASE publish=true prerelease=true
          else
            version=$base tag='' publish=false prerelease=false
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"
          echo "### Release plan: $version (publish: $publish, prerelease: $prerelease)" >>"$GITHUB_STEP_SUMMARY"

  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.checks }}
    uses: ./.github/workflows/ci.yml
    with:
      linux-only: true

  linux:
    name: Build and smoke-test Linux packages
    needs: [plan, checks]
    # A dry run may skip the checks; a release may not.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # The Last.fm key and secret and the Discord application ID are secrets
    # of the `release` environment, which only runs from main. A dry run
    # from a branch has none, and Sona reads the same variables at runtime.
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # sign the build provenance
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # A prerelease's version is VERSION-<rc>; the packages read VERSION.
      - name: Set the version
        if: ${{ needs.plan.outputs.prerelease == 'true' }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "$VERSION" >VERSION

      # release.sh's output directory and the directory it keeps the Go and
      # pnpm caches in; both outside the checkout, which release.sh snapshots.
      - name: Choose the output and cache directories
        run: |
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >>"$GITHUB_ENV"
          echo "CACHE_DIR=$RUNNER_TEMP/release-cache" >>"$GITHUB_ENV"

      # release.sh builds in a container whose Go module and build caches and
      # pnpm store sit in CACHE_DIR; a run restores the last run's and a new
      # go.sum or pnpm lockfile refills it. Only runs on main save a cache
      # every run can restore.
      - name: Cache Go modules, Go build and pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_DIR }}
          key: release-${{ runner.os }}-${{ hashFiles('go.sum', 'frontend/pnpm-lock.yaml') }}
          restore-keys: release-${{ runner.os }}-

      # Podman is preinstalled on the runner image.
      - name: Build and smoke-test packages
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
          SONA_RELEASE_CACHE: ${{ env.CACHE_DIR }}
        run: bash build/linux/release/release.sh "$RELEASE_DIR"

      - name: Check SHA256SUMS
        working-directory: ${{ env.RELEASE_DIR }}
        run: |
          sha256sum --check --strict SHA256SUMS
          {
            echo '### Linux SHA256SUMS'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Verify with `gh attestation verify <file> --repo "$GITHUB_REPOSITORY"`.
      # A dry run has no release to vouch for, so it signs nothing.
      - name: Attest build provenance
        if: ${{ needs.plan.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.RELEASE_DIR }}/SHA256SUMS

      - name: Keep the packages for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: |
            ${{ env.RELEASE_DIR }}/sona[-_]*
            ${{ env.RELEASE_DIR }}/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.publish == 'true' && 14 || 7 }}

  macos:
    name: Build and smoke-test macOS
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Choose the output and GStreamer cache directories
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/release" >>"$GITHUB_ENV"
          echo "GSTREAMER_PKG_CACHE=$RUNNER_TEMP/gstreamer-pkg" >>"$GITHUB_ENV"

      # The official GStreamer framework's runtime and development packages,
      # pinned and checked by build/darwin/gstreamer.sha256.
      - name: Cache the GStreamer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GSTREAMER_PKG_CACHE }}
          key: gstreamer-pkg-${{ hashFiles('build/darwin/gstreamer.sha256') }}

      - name: Install GStreamer and pkg-config
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          build/darwin/install-gstreamer.sh

      # The update feed and key are linked in only where the key is committed
      # (internal/update/update.pub); without them the build never updates.
      - name: Build, bundle and sign ad hoc
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
          SONA_SMOKE_TOOLS: "1"
        run: |
          if [ -s internal/update/update.pub ]; then
            export UPDATE_FEED="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update-darwin-arm64.json"
            UPDATE_KEY=$(cat internal/update/update.pub)
            export UPDATE_KEY
          else
            echo "::warning::internal/update/update.pub is empty: this build will not self-update"
          fi
          build/darwin/bundle.sh "$OUT_DIR"

      - name: Smoke-test the bundle
        run: build/darwin/smoke.sh "$OUT_DIR"

      - name: Checksums
        working-directory: ${{ env.OUT_DIR }}
        run: |
          sha256sum() { shasum -a 256 "$@"; }
          sha256sum Sona-*.dmg sona-*-darwin-arm64.tar.gz >macos-sums
          cat macos-sums
          {
            echo '### macOS SHA256SUMS'
            echo '```'
            cat macos-sums
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: ${{ needs.plan.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.OUT_DIR }}/macos-sums

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: |
            ${{ env.OUT_DIR }}/Sona-*.dmg
            ${{ env.OUT_DIR }}/sona-*-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.publish == 'true' && 14 || 7 }}

  windows:
    name: Build and smoke-test Windows
    needs: [plan, checks]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 45
    environment: ${{ needs.plan.outputs.publish == 'true' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # mattn/go-sqlite3 needs cgo: the runner's MinGW-w64 gcc. MyGo itself
      # is pure Go on Windows.
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install NSIS
        run: |
          choco install nsis --yes --no-progress
          echo "C:\\Program Files (x86)\\NSIS" >>"$GITHUB_PATH"

      - name: Choose the output directory
        run: echo "OUT_DIR=$RUNNER_TEMP/release" >>"$GITHUB_ENV"

      - name: Build, zip and make the installer
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
        run: |
          if [ -s internal/update/update.pub ]; then
            export UPDATE_FEED="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/update-windows-amd64.json"
            UPDATE_KEY=$(cat internal/update/update.pub)
            export UPDATE_KEY
          else
            echo "::warning::internal/update/update.pub is empty: this build will not self-update"
          fi
          build/windows/package.sh "$OUT_DIR"

      - name: Smoke-test the zip and the installer
        run: build/windows/smoke.sh "$OUT_DIR"

      - name: Checksums
        working-directory: ${{ env.OUT_DIR }}
        run: |
          sha256sum Sona-*.zip Sona-*-setup.exe sona-*-windows-amd64.tar.gz >windows-sums
          {
            echo '### Windows SHA256SUMS'
            echo '```'
            cat windows-sums
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        if: ${{ needs.plan.outputs.publish == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.OUT_DIR }}/windows-sums

      - name: Keep the files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release
          path: |
            ${{ env.OUT_DIR }}/Sona-*.zip
            ${{ env.OUT_DIR }}/Sona-*-setup.exe
            ${{ env.OUT_DIR }}/sona-*-windows-amd64.tar.gz
          if-no-files-found: error
          retention-days: ${{ needs.plan.outputs.publish == 'true' && 14 || 7 }}

  publish:
    name: Sign the update manifests and publish the GitHub release
    needs: [plan, linux, macos, windows]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    # SONA_UPDATE_KEY (the Ed25519 key `go tool mygo keygen` wrote) is a
    # secret of the `release` environment.
    environment: release
    permissions:
      contents: read
      id-token: write # attest the manifests and the checksums
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PRERELEASE: ${{ needs.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The upload and the publish go through the bot-cecil App token.
      - name: Generate bot-cecil token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # upload to and publish the release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-release"
          merge-multiple: true
          path: release

      # The Linux job checked its own SHA256SUMS; the one published covers
      # every file below, the manifests included.
      - name: Check the Linux checksums
        working-directory: release
        run: |
          sha256sum --check --strict SHA256SUMS
          rm SHA256SUMS

      # A tag's draft was made by release-please. A prerelease has none: this
      # makes it (a draft, so nothing is visible before the upload is whole).
      - name: Find or create the draft release
        id: notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$PRERELEASE" = true || { echo "::error::no draft release for $TAG"; exit 1; }
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --target "$GITHUB_SHA" \
              --title "Sona $VERSION" \
              --notes "Test build $VERSION from $GITHUB_SHA. Not for general use: it only updates to later test builds, with Settings → Updates → Test versions on."
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          echo "draft=$draft" >>"$GITHUB_OUTPUT"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body >changelog.md

      # Signed last, over archives that are already in release/, so a
      # manifest never names an archive that isn't there. Without the key the
      # step says so and the release has no manifests (no self-updates).
      - name: Sign the update manifests
        if: ${{ steps.notes.outputs.draft == 'true' }}
        env:
          SONA_UPDATE_KEY: ${{ secrets.SONA_UPDATE_KEY }}
        run: |
          if [ -z "$SONA_UPDATE_KEY" ]; then
            msg="SONA_UPDATE_KEY is not set: update manifests are NOT signed and this release has no update-<target>.json; installs will not self-update."
            echo "::warning::$msg"
            echo "### Update signing skipped" >>"$GITHUB_STEP_SUMMARY"
            echo "$msg" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          for target in darwin-arm64 windows-amd64; do
            archive=$(ls release/sona-"$VERSION"-"$target".tar.gz)
            go run ./cmd/releasesign -target "$target" -archive "$archive" -version "$VERSION" \
              -url "$base/$(basename "$archive")" -notes changelog.md \
              -date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -out "release/update-$target.json"
          done
          echo "### Update manifests signed" >>"$GITHUB_STEP_SUMMARY"
          ls -l release/update-*.json >>"$GITHUB_STEP_SUMMARY"

      - name: Write SHA256SUMS
        if: ${{ steps.notes.outputs.draft == 'true' }}
        working-directory: release
        run: |
          printf '%s\0' * | LC_ALL=C xargs -0 sha256sum >SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          {
            echo '### SHA256SUMS'
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # The platform jobs attested the archives; this vouches for the
      # manifests and every checksum in the published SHA256SUMS. Verify with
      # `gh attestation verify <file> --repo "$GITHUB_REPOSITORY"`.
      - name: Attest build provenance
        if: ${{ steps.notes.outputs.draft == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      # Re-running the job uploads again over the same names (--clobber); a
      # release that is already published is left alone. Archives go up
      # before the manifests that name them. Publishing a tag's release makes
      # it the latest, which the update check reads; a prerelease never is.
      - name: Upload the files and publish
        if: ${{ steps.notes.outputs.draft == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: release
        run: |
          shopt -s nullglob
          manifests=(update-*.json)
          files=()
          for f in *; do
            case $f in update-*.json | SHA256SUMS) ;; *) files+=("$f") ;; esac
          done
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          if [ ${#manifests[@]} -gt 0 ]; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${manifests[@]}"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS

          marker='<!-- sona-install-notes -->'
          if grep -qF "$marker" ../changelog.md; then
            cp ../changelog.md ../notes.md
          else
            { cat ../changelog.md; printf '\n%s\n' "$marker"; cat ../.github/release-notes/install.md; } >../notes.md
          fi
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Sona $VERSION" --notes-file ../notes.md --prerelease --draft=false --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Sona $VERSION" --notes-file ../notes.md --draft=false --latest
          fi

      - name: Already published
        if: ${{ steps.notes.outputs.draft != 'true' }}
        run: echo "::notice::$TAG is already published; nothing to upload"
