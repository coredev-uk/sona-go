# Checks that the `release` environment provides the secrets release.yml
# compiles into release builds, without building or publishing anything:
# dispatch it from main (Actions → Release secrets → Run workflow) after
# adding or rotating one. It prints only whether each is set.
name: Release secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Release environment secrets are set
    runs-on: ubuntu-26.04
    environment: release
    steps:
      - name: Check the secrets
        env:
          SONA_LASTFM_KEY: ${{ secrets.SONA_LASTFM_KEY }}
          SONA_LASTFM_SECRET: ${{ secrets.SONA_LASTFM_SECRET }}
          SONA_DISCORD_CLIENT_ID: ${{ secrets.SONA_DISCORD_CLIENT_ID }}
        run: |
          missing=0
          for name in SONA_LASTFM_KEY SONA_LASTFM_SECRET SONA_DISCORD_CLIENT_ID; do
            if [ -n "${!name}" ]; then
              echo "$name: set"
            else
              echo "::error::$name is not set in the release environment"
              missing=1
            fi
          done
          exit "$missing"
