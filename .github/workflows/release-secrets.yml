# Checks that the Proton Pass token of the `release` environment still reads
# the four items release.yml needs (vault "CI": the update
# signing key, the Last.fm key and secret, the Discord application ID),
# without building or publishing anything. It prints only whether each is
# set. Monthly, so an expired or revoked token (it expires 2027-11-14) is
# caught before a release, and a failed scheduled run opens, or comments on,
# an issue; dispatch it from main (Actions → Release secrets → Run workflow)
# after editing an item or renewing the token.
name: Release secrets

on:
  schedule:
    - cron: "17 6 1 * *" # the 1st, 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Release secrets resolve from Proton Pass
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
      issues: write
    steps:
      - name: Load the release secrets from Proton Pass
        # main: v1.1.0 plus its built dist/; the v1 tags ship no dist/index.js
        uses: protonpass/load-secret-action@e51765b8ef320ff9304a1f6523737714b67c5ddf # v1.1.0
        with:
          version: 2.7.0
          hash: fd933e76179a5a33b295853e9c6696e49e584fe2141b1aafc63a3d78c0791cdb
          export-env: "true"
        env:
          PROTON_PASS_PERSONAL_ACCESS_TOKEN: ${{ secrets.PROTON_PASS_PERSONAL_ACCESS_TOKEN }}
          SONA_UPDATE_KEY: pass://CI/Update Signing Key/SONA_UPDATE_KEY
          SONA_LASTFM_KEY: pass://CI/Last.fm API/SONA_LASTFM_KEY
          SONA_LASTFM_SECRET: pass://CI/Last.fm API/SONA_LASTFM_SECRET
          SONA_DISCORD_CLIENT_ID: pass://CI/Discord App/SONA_DISCORD_CLIENT_ID

      - name: Check the secrets
        run: |
          missing=0
          for name in SONA_UPDATE_KEY SONA_LASTFM_KEY SONA_LASTFM_SECRET SONA_DISCORD_CLIENT_ID; do
            if [ -n "${!name}" ]; then
              echo "$name: set"
            else
              echo "::error::$name is missing: check the item in the Proton Pass vault \"CI\""
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out the failure reporter
        if: failure() && github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report a failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci/report-failure.sh "Release secrets unreadable" "The monthly Release secrets run failed (an expired or revoked Proton Pass token, or a missing item)"
