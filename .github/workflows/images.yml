# The CI image (build/ci/Containerfile) is built for amd64 and arm64 on a
# runner of each, then published as one manifest under
# ghcr.io/coredev-uk/sona-ci:<tag> (build/ci/tag.sh: the Containerfile's hash
# with the Go and gotestsum versions of go.mod). Storage in GHCR for a public
# repository does not count against the Actions cache cap.
#
# Who may publish what. The tag every other run pulls is written only by a run
# on main (a push, the weekly run, a dispatch), which also attests the build
# provenance of the manifest it pushed; build/ci/find-image.sh verifies that
# attestation (images.yml, refs/heads/main) before main, the nightly and a
# release run in the image. A pull request of this repository that changes
# build/ci or go.mod and finds no image of the tag builds it under
# pr-<tag>, which only pull request runs read, and publishes no provenance.
# A pull request's CI waits for the image (ci.yml, "CI image"); the weekly run
# and a dispatch rebuild it to pick up the distribution's updates, and CI pins
# the digest it finds, so a rebuild never changes a run in progress.
#
# The Linux release build image (build/linux/release/Containerfile) is not
# published: release.sh builds it in the release job.
name: Images

on:
  push:
    branches: [main]
    paths:
      - build/ci/**
      - go.mod
      - .github/workflows/images.yml
  pull_request:
    paths:
      - build/ci/**
      - go.mod
      - .github/workflows/images.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  # Which tag the CI image has, and whether it must be built.
  ci-image-plan:
    name: CI image tag
    # A fork's pull request can't push packages.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      prefix: ${{ steps.plan.outputs.prefix }}
      args: ${{ steps.plan.outputs.args }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only main publishes the tag itself; any other ref publishes pr-<tag>.
      # On main an existing image is kept only when find-image.sh --check
      # finds the provenance of a main build on it, so an image that predates
      # the attestation, or one another ref pushed, is rebuilt.
      - name: Name the image and look for it
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          tag=$(build/ci/tag.sh)
          prefix=pr-
          [ "$REF" = refs/heads/main ] && prefix=
          {
            echo "tag=$tag"
            echo "prefix=$prefix"
            echo "args=$(build/ci/tag.sh args)"
          } >>"$GITHUB_OUTPUT"
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          elif build/ci/find-image.sh --check; then
            echo "build=false" >>"$GITHUB_OUTPUT"
            echo "an image of $tag exists"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

  ci-image-build:
    name: CI image (${{ matrix.arch }})
    needs: ci-image-plan
    if: ${{ needs.ci-image-plan.outputs.build == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      contents: read
      packages: write # push the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and push the image for one architecture
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.ci-image-plan.outputs.prefix }}${{ needs.ci-image-plan.outputs.tag }}
          ARGS: ${{ needs.ci-image-plan.outputs.args }}
          ARCH: ${{ matrix.arch }}
        run: |
          image=ghcr.io/coredev-uk/sona-ci:$TAG-$ARCH
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          # shellcheck disable=SC2086
          podman build --pull=always $ARGS -t "$image" -f build/ci/Containerfile build/ci
          podman push "$image"

  ci-image:
    name: CI image
    needs: [ci-image-plan, ci-image-build]
    if: ${{ needs.ci-image-plan.outputs.build == 'true' && !cancelled() && needs.ci-image-build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # push the manifest
      id-token: write # sign the build provenance (main only)
      attestations: write # store it
    steps:
      - name: Publish one manifest for both architectures
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ needs.ci-image-plan.outputs.prefix }}${{ needs.ci-image-plan.outputs.tag }}
        run: |
          image=ghcr.io/coredev-uk/sona-ci
          printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$ACTOR" --password-stdin
          podman manifest create "$image:$TAG"
          for arch in amd64 arm64; do
            podman manifest add "$image:$TAG" "docker://$image:$TAG-$arch"
          done
          podman manifest push --all --digestfile "$RUNNER_TEMP/digest" "$image:$TAG" "docker://$image:$TAG"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >>"$GITHUB_OUTPUT"
          echo "### Pushed $image:$TAG (amd64, arm64)" >>"$GITHUB_STEP_SUMMARY"

      # What find-image.sh verifies before a run on main, the nightly or a
      # release uses the image: provenance from this workflow on main.
      - name: Attest the manifest's build provenance
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/coredev-uk/sona-ci
          subject-digest: ${{ steps.manifest.outputs.digest }}
