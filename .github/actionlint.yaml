# actionlint config (run `nix run nixpkgs#actionlint`).
paths:
  .github/workflows/release.yml:
    ignore:
      # The build job's `release` environment provides these secrets in the
      # called workflow; actionlint only knows the workflow_call secrets.
      - 'property "sona_(lastfm_key|lastfm_secret|discord_client_id)" is not defined in object type'
