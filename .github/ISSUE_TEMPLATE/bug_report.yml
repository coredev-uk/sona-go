name: Bug report
description: Something in Sona does not work as expected.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The first few answers set the labels that route your report, so please pick the closest
        match. Never paste tokens, passwords or the contents of `.env` or your keyring.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      description: Linux, the distribution and version. macOS and Windows, the version.
      placeholder: e.g. Fedora 41, Ubuntu 24.04, macOS 15.1, Windows 11 24H2
  - type: input
    id: desktop
    attributes:
      label: Desktop and session
      description: Linux only.
      placeholder: e.g. GNOME 47 on Wayland, KDE Plasma 6 on X11, Hyprland
  - type: dropdown
    id: install
    attributes:
      label: How you installed
      options:
        - .deb
        - .rpm
        - Arch / AUR
        - AppImage
        - Flatpak
        - macOS .dmg
        - Windows installer
        - Windows zip
        - Built from source
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where the problem is, as best you can tell. "Not sure" is fine.
      options:
        - Playback, the queue or audio output
        - "My library: songs, albums, artists, playlists"
        - Search
        - Pages, menus, windows or how Sona looks
        - Themes
        - Add-ons
        - Installing or updating Sona
        - Signing in
        - Last.fm, Discord, media keys or the desktop
        - "Accessibility: screen reader, keyboard, contrast"
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once
  - type: input
    id: version
    attributes:
      label: Sona version
      description: "Settings → Diagnostics shows it, or run `sona --version`."
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      render: text
      description: |
        If you can, open Settings → Diagnostics, press "Copy diagnostics" and paste the result here. It lists your
        versions, devices and recent log lines, so we rarely have to ask. Sona redacts tokens and secrets from it, but
        please look it over before posting.
  - type: textarea
    id: logs
    attributes:
      label: Other logs or screenshots
      description: Drag files in or paste text. Remove anything personal (account names, library contents) first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the existing issues and this is not already reported.
          required: true
        - label: I am on the latest release or release candidate.
          required: true
        - label: I removed personal data (account names, tokens, library contents) from everything I pasted.
          required: true
