name: Bug report
description: Something in Sona does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Never paste tokens, passwords or the contents of `.env` or your keyring.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sona version
      description: Run `sona --version`, or see the Diagnostics bundle.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How you installed Sona
      placeholder: e.g. .deb, .rpm, AUR, AppImage, built from source
  - type: input
    id: distro
    attributes:
      label: Distribution and version
      placeholder: e.g. Fedora 41, Ubuntu 24.04, Arch
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop and session
      placeholder: e.g. GNOME 47 on Wayland, KDE Plasma 6 on X11, Hyprland
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      render: text
      description: |
        If you can, open Settings → Diagnostics, press "Copy diagnostics" and paste the result here. Sona redacts
        tokens and secrets from the bundle, but please look it over before posting.
  - type: textarea
    id: logs
    attributes:
      label: Other logs or screenshots
      description: Remove anything personal (account names, library contents) first.
