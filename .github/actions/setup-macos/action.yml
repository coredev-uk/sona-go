name: Set up macOS
description: >-
  Go from go.mod, Go's module and build caches restored from the last run on
  main, and the official GStreamer framework (setup-macos-gstreamer). The
  caller saves the Go caches last, with actions/cache/save, key and path from
  this action's outputs. The GStreamer environment for cgo is exported to later
  steps.
inputs:
  flavor:
    description: Name of the Go build cache
    required: true
outputs:
  cache-key:
    description: Key to save the Go caches under
    value: ${{ steps.keys.outputs.key }}
  cache-path:
    description: Paths the Go caches live in
    value: ${{ steps.keys.outputs.path }}
runs:
  using: composite
  steps:
    - name: Work out the cache keys
      id: keys
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
        RUN_ID: ${{ github.run_id }}
        GO_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
      run: |
        {
          echo "key=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-$GO_HASH-$RUN_ID"
          echo "restore=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-$GO_HASH-"
          echo "fallback=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-"
          echo "path<<EOF"
          echo "$HOME/Library/Caches/go-build"
          echo "$HOME/go/pkg/mod"
          echo "EOF"
        } >>"$GITHUB_OUTPUT"

    - name: Restore Go's caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.path }}
        key: ${{ steps.keys.outputs.key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore }}
          ${{ steps.keys.outputs.fallback }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false

    - uses: ./.github/actions/setup-macos-gstreamer
