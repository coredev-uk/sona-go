name: Set up GStreamer on macOS
description: >-
  The official GStreamer framework (the .pkg downloads cached, pinned and
  checked by build/darwin/gstreamer.sha256) and pkg-config. The environment for
  cgo (PKG_CONFIG_PATH, the deployment target and its compiler and linker
  flags) and the framework's tools are exported to later steps. Go is the
  caller's job (setup-macos does it too).
runs:
  using: composite
  steps:
    - name: Restore the GStreamer packages
      id: pkg
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gstreamer-pkg
        key: gstreamer-pkg-${{ hashFiles('build/darwin/gstreamer.sha256') }}

    - name: Install GStreamer and pkg-config
      shell: bash
      env:
        GSTREAMER_PKG_CACHE: ${{ runner.temp }}/gstreamer-pkg
      run: |
        command -v pkg-config >/dev/null || brew install pkgconf
        build/darwin/install-gstreamer.sh
        fw=/Library/Frameworks/GStreamer.framework/Versions/1.0
        minos=$(cat build/darwin/MIN_MACOS)
        {
          echo "PKG_CONFIG_PATH=$fw/lib/pkgconfig"
          echo "MACOSX_DEPLOYMENT_TARGET=$minos"
          echo "CGO_CFLAGS=-mmacosx-version-min=$minos"
          echo "CGO_LDFLAGS=-mmacosx-version-min=$minos"
        } >>"$GITHUB_ENV"
        # gst-launch-1.0 and gst-inspect-1.0, which the motion tests look for.
        echo "$fw/bin" >>"$GITHUB_PATH"

    - name: Save the GStreamer packages
      if: ${{ steps.pkg.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/gstreamer-pkg
        key: gstreamer-pkg-${{ hashFiles('build/darwin/gstreamer.sha256') }}
