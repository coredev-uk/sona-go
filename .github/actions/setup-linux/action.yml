name: Set up Linux
description: >-
  The system packages (their .debs cached, so a run unpacks them instead of
  downloading), Go from go.mod, and Go's module and build caches restored from
  the last run on main (never across an update of the runner image or of the
  CI image, SONA_CI_IMAGE: the image's Pango and fonts decide what a cached
  pass means). In the CI image (a `container:` job; set SONA_CI_IMAGE to its
  digest) Go and the packages are already there: use `packages: none`, or a
  short list of what the image lacks (`orca`; the step is root there and its
  .debs are cached per image). The caller saves the Go caches last, with
  actions/cache/save, key and path from this action's outputs.
inputs:
  packages:
    description: Package list to install (packages-<this>.txt beside this file; "none" installs nothing)
    default: test
  flavor:
    description: Name of the Go build cache (one per kind of build, so a restore never carries another's objects)
    required: true
outputs:
  cache-key:
    description: Key to save the Go caches under
    value: ${{ steps.keys.outputs.key }}
  cache-path:
    description: Paths the Go caches live in
    value: ${{ steps.keys.outputs.path }}
  save:
    description: "true where a run may save caches: pushes to main and dispatches (pull requests only restore)"
    value: ${{ steps.keys.outputs.save }}
runs:
  using: composite
  steps:
    - name: Work out the cache keys
      id: keys
      shell: bash
      env:
        FLAVOR: ${{ inputs.flavor }}
        CI_IMAGE: ${{ env.SONA_CI_IMAGE }}
        PACKAGES: ${{ inputs.packages }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        RUN_ID: ${{ github.run_id }}
        GO_HASH: ${{ hashFiles('go.mod', 'go.sum') }}
        PKG_HASH: ${{ inputs.packages != 'none' && hashFiles(format('.github/actions/setup-linux/packages-{0}.txt', inputs.packages)) || 'none' }}
      run: |
        IMAGE_ID=${CI_IMAGE:+ci${CI_IMAGE:0:12}}
        IMAGE_ID=${IMAGE_ID:-${ImageVersion:-unknown}}
        {
          echo "key=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-${IMAGE_ID}-$GO_HASH-$RUN_ID"
          echo "restore=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-${IMAGE_ID}-$GO_HASH-"
          echo "fallback=go-$FLAVOR-$RUNNER_OS-$RUNNER_ARCH-${IMAGE_ID}-"
          echo "path<<EOF"
          echo "$HOME/.cache/go-build"
          echo "$HOME/go/pkg/mod"
          echo "EOF"
          echo "apt=apt-$PACKAGES-$RUNNER_OS-$RUNNER_ARCH-${IMAGE_ID}-$PKG_HASH"
          if [ "$REF" = refs/heads/main ] || [ "$EVENT" = workflow_dispatch ]; then echo save=true; else echo save=false; fi
        } >>"$GITHUB_OUTPUT"

    - name: Restore the .debs
      id: apt
      if: ${{ inputs.packages != 'none' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.keys.outputs.apt }}

    - name: Restore Go's caches
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.keys.outputs.path }}
        key: ${{ steps.keys.outputs.key }}
        restore-keys: |
          ${{ steps.keys.outputs.restore }}
          ${{ steps.keys.outputs.fallback }}

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: ${{ env.SONA_CI_IMAGE == '' }}
      with:
        go-version-file: go.mod
        cache: false

    # dpkg's fsync on every file and the documentation it unpacks are most of
    # the install time on a runner. In a container job (the CI image) the step
    # is already root, and there is no sudo.
    - name: Install system packages
      if: ${{ inputs.packages != 'none' }}
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        root() { if [[ $(id -u) -eq 0 ]]; then "$@"; else sudo "$@"; fi; }
        printf 'force-unsafe-io\npath-exclude=/usr/share/doc/*\npath-exclude=/usr/share/man/*\npath-exclude=/usr/share/info/*\n' | root tee /etc/dpkg/dpkg.cfg.d/90-ci >/dev/null
        mkdir -p ~/apt-archives/partial
        # A mirror that stalls once held a job for twenty minutes: every
        # attempt has a deadline, and a stalled one is tried again.
        # An install that was cut off mid-unpack leaves dpkg half done:
        # configure what was unpacked before the next attempt.
        apt() {
          local i limit=150
          [[ $1 == install ]] && limit=600
          for i in 1 2 3; do
            root timeout "$limit" apt-get -o Acquire::http::Timeout=15 -o Acquire::Retries=3 -o Dir::Cache::archives="$HOME/apt-archives" "$@" && return 0
            echo "apt-get $1 did not finish (attempt $i)"
            root dpkg --configure -a || true
          done
          return 1
        }
        apt update -qq
        # shellcheck disable=SC2046
        apt install -y --no-install-recommends $(cat "${GITHUB_ACTION_PATH}/packages-$PACKAGES.txt")
        root rm -rf ~/apt-archives/lock ~/apt-archives/partial
        root chown -R "$(id -u):$(id -g)" ~/apt-archives

    - name: Save the .debs
      if: ${{ inputs.packages != 'none' && steps.apt.outputs.cache-hit != 'true' && steps.keys.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.keys.outputs.apt }}
