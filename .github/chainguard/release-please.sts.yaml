# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# release-please.yml, release-please job: opens the release PR, labels it and creates the tag and draft release as bot-cecil, so CI runs on the PR.
issuer: https://token.actions.githubusercontent.com
subject: repo:coredev-uk@64542347/sona-go@1441430256:environment:bot-cecil
claim_pattern:
  workflow_ref: coredev-uk/sona-go/\.github/workflows/release-please\.yml@refs/heads/main
permissions:
  contents: write
  issues: write
  pull_requests: write
