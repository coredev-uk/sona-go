version: '3'

# Sona build tasks. `go tool wails3 build|package|dev` run these through
# Wails' embedded Task runner. Linux is the only release target; on
# macOS `build`, `run` and so `dev` make an unsigned development
# build (build/darwin/Taskfile.yml), and packaging stays Linux-only.
#
# Never add `go mod tidy` here: other packages are developed in parallel and
# tidy would drop their dependencies.

vars:
  APP_NAME: "sona"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: "pnpm"
  # The single version source: VERSION. build/linux/Taskfile.yml injects it
  # into the binary (-X main.version) and the packages (nfpm SONA_VERSION).
  VERSION:
    sh: cat "{{.ROOT_DIR}}/VERSION"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application (production unless DEV=true)
    cmds:
      - task: '{{if eq OS "darwin"}}darwin{{else}}linux{{end}}:build'

  package:
    summary: Packages a production build as .deb, .rpm, Arch package and AppImage
    cmds:
      - task: linux:package

  release:
    summary: Builds and smoke-tests release packages on Ubuntu 24.04 in a container (bin/release)
    cmds:
      - task: linux:release

  run:
    summary: Runs the built application
    cmds:
      - task: '{{if eq OS "darwin"}}darwin{{else}}linux{{end}}:run'

  dev:
    summary: Runs the application in development mode with Vite hot reload
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
