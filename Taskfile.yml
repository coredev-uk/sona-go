version: '3'

# Sona packaging tasks. Day-to-day building, testing and checking are devenv
# scripts (devenv.nix: build, dev, tests, check); this Taskfile only packages
# a release build. Linux is the only release target (docs/architecture.md §9);
# on macOS `build` makes an unsigned development build
# (build/darwin/Taskfile.yml).
#
# Never add `go mod tidy` here: other packages are developed in parallel and
# tidy would drop their dependencies.

vars:
  APP_NAME: "sona"
  BIN_DIR: "bin"
  # The single version source: VERSION. build/linux/Taskfile.yml injects it
  # into the binary (-X main.version) and the packages (nfpm SONA_VERSION).
  VERSION:
    sh: cat "{{.ROOT_DIR}}/VERSION"

includes:
  linux: ./build/linux/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the production application into bin/sona
    cmds:
      - task: '{{if eq OS "darwin"}}darwin{{else}}linux{{end}}:build'

  package:
    summary: Packages a production build as .deb, .rpm and Arch package (the AppImage returns in phase 4)
    cmds:
      - task: linux:package

  release:
    summary: Builds and smoke-tests release packages on Ubuntu 24.04 in a container (bin/release)
    cmds:
      - task: linux:release

  run:
    summary: Runs the built application
    cmds:
      - task: '{{if eq OS "darwin"}}darwin{{else}}linux{{end}}:run'
