<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sona Engine</title>
</head>
<body>
<script>
"use strict";
// Sona playback engine page. Served by Go (CDP Fetch.fulfillRequest) at
// https://music.apple.com/sona-engine/ so that MusicKit's requests carry the
// apple.com origin the web player developer token requires.
(() => {
  const emit = (type, data) => {
    // window.sonaEmit is a Go func exposed over CDP; it returns a promise.
    window.sonaEmit?.({ type, data }).catch(() => {});
  };
  let mkReady = null;
  const loadMusicKit = () => {
    if (mkReady) return mkReady;
    mkReady = new Promise((resolve, reject) => {
      if (window.MusicKit) return resolve(window.MusicKit);
      document.addEventListener("musickitloaded", () => resolve(window.MusicKit), { once: true });
      const s = document.createElement("script");
      s.src = "https://js-cdn.music.apple.com/musickit/v3/musickit.js";
      s.async = true;
      s.onerror = () => reject(new Error("musickit.js failed to load"));
      document.head.appendChild(s);
    });
    return mkReady;
  };

  const snapshot = (mk) => {
    const item = mk.nowPlayingItem;
    return {
      state: MusicKit.PlaybackStates[mk.playbackState] ?? String(mk.playbackState),
      time: mk.currentPlaybackTime,
      duration: mk.currentPlaybackDuration,
      authorized: mk.isAuthorized,
      volume: mk.volume,
      item: item ? {
        id: item.id,
        title: item.title,
        artist: item.artistName,
        album: item.albumName,
        durationMs: item.playbackDuration,
        isPreview: !!(item.isPreview ?? item.previewURL === item.assetURL),
        flavor: item.flavor ?? null,
      } : null,
    };
  };

  let lastTimeEmit = 0;

  window.sona = {
    async widevine() {
      const configs = [{
        initDataTypes: ["cenc"],
        audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"', robustness: "SW_SECURE_CRYPTO" }],
      }];
      try {
        const access = await navigator.requestMediaKeySystemAccess("com.widevine.alpha", configs);
        const keys = await access.createMediaKeys();
        return { ok: !!keys, keySystem: access.keySystem, config: access.getConfiguration() };
      } catch (e) {
        return { ok: false, error: String(e) };
      }
    },

    // Plays Google's public Widevine DASH test asset; proves license + decrypt.
    async drmSelfTest(seconds = 6) {
      await new Promise((resolve, reject) => {
        if (window.shaka) return resolve();
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("shaka failed to load"));
        document.head.appendChild(s);
      });
      shaka.polyfill.installAll();
      const video = document.createElement("video");
      video.muted = true;
      document.body.appendChild(video);
      const player = new shaka.Player();
      await player.attach(video);
      player.configure({ drm: { servers: { "com.widevine.alpha": "https://cwip-shaka-proxy.appspot.com/no_auth" } } });
      await player.load("https://storage.googleapis.com/shaka-demo-assets/angel-one-widevine/dash.mpd");
      await video.play();
      await new Promise((r) => setTimeout(r, seconds * 1000));
      const res = {
        currentTime: video.currentTime,
        keySystem: player.keySystem(),
        decodedFrames: video.getVideoPlaybackQuality?.().totalVideoFrames ?? null,
        stats: player.getStats().licenseTime,
      };
      await player.destroy();
      video.remove();
      return res;
    },

    // storefrontId is deliberately not passed: MusicKit derives it from the
    // account. Passing the account's own storefront ("gb") made play() throw
    // CONTENT_EQUIVALENT from assertUserStorefront (observed 2026-10-29).
    async configure(developerToken, musicUserToken) {
      const MK = await loadMusicKit();
      const mk = await MK.configure({
        developerToken,
        app: { name: "Sona", build: "0.0.1" },
        bitrate: MK.PlaybackBitrate.HIGH,
        suppressErrorDialog: true,
      });
      if (musicUserToken) mk.musicUserToken = musicUserToken;
      if (!window.__sonaListeners) {
        window.__sonaListeners = true;
        mk.addEventListener("playbackStateDidChange", () => emit("state", snapshot(mk)));
        mk.addEventListener("nowPlayingItemDidChange", () => emit("item", snapshot(mk)));
        mk.addEventListener("playbackTimeDidChange", () => {
          const now = Date.now();
          if (now - lastTimeEmit >= 1000) { lastTimeEmit = now; emit("time", snapshot(mk)); }
        });
        mk.addEventListener("mediaPlaybackError", (e) => emit("error", { message: String(e?.message ?? e), name: e?.name ?? null }));
        mk.addEventListener("authorizationStatusDidChange", () => emit("auth", { authorized: mk.isAuthorized }));
      }
      return { version: MK.version, authorized: mk.isAuthorized, storefront: mk.storefrontId };
    },

    async playSong(id, startTime = 0) {
      const mk = MusicKit.getInstance();
      await mk.setQueue({ song: id, startPlaying: false });
      await mk.play();
      if (startTime > 0) await mk.seekToTime(startTime);
      return snapshot(mk);
    },
    async pause() { const mk = MusicKit.getInstance(); await mk.pause(); return snapshot(mk); },
    async resume() { const mk = MusicKit.getInstance(); await mk.play(); return snapshot(mk); },
    async seek(t) { const mk = MusicKit.getInstance(); await mk.seekToTime(t); return snapshot(mk); },
    async setVolume(v) { const mk = MusicKit.getInstance(); mk.volume = v; return snapshot(mk); },
    async stop() { const mk = MusicKit.getInstance(); await mk.stop(); return snapshot(mk); },
    async state() { return snapshot(MusicKit.getInstance()); },
    async signOut() { const mk = MusicKit.getInstance(); await mk.unauthorize(); return snapshot(mk); },
  };

  emit("ready", { href: location.href });
})();
</script>
</body>
</html>
