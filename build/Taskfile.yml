version: '3'

tasks:
  install:frontend:deps:
    summary: Installs frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found; run inside devenv"
    cmds:
      - pnpm install --frozen-lockfile

  generate:bindings:
    summary: Generates TypeScript bindings for the Wails services into frontend/bindings
    run: once
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
      - exclude: frontend/**/*
    generates:
      - frontend/bindings/**/*
    cmds:
      - go tool wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts ./cmd/sona

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Builds the frontend into frontend/dist
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: Runs the Vite dev server
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - pnpm dev --port {{.VITE_PORT}} --strictPort
