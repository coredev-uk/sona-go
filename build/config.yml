# Wails project configuration. `wails3 dev` reads dev_mode; `info` feeds
# `wails3 update build-assets` (which would overwrite build/linux, so edit the
# files there by hand instead).
version: '3'

info:
  companyName: "Sona"
  productName: "Sona"
  productIdentifier: "dev.coredev.Sona"
  description: "Apple Music for the Linux desktop"
  copyright: "(c) 2026, Sona contributors"
  comments: "Apple Music desktop client"
  # No version here: VERSION is the single source. Only `wails3 update
  # build-assets` would read one; pass -productversion "$(cat VERSION)".

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - .devenv
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task common:dev:frontend
      type: background
    - cmd: go tool wails3 task run
      type: primary
      exit_policy: shutdown
