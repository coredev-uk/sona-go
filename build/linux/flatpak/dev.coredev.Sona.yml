# Flatpak manifest for Sona. Feasibility notes and the reason for every
# permission: docs/flatpak.md.
#
# This manifest builds Sona from the working tree in org.gnome.Sdk, with the Go
# toolchain from org.freedesktop.Sdk.Extension.golang and every Go module
# supplied as a checksummed source (go-sources.json), so the build needs no
# network. MyGo loads GTK3, libepoxy, AT-SPI, libsecret and EGL by soname, and
# org.gnome.Platform provides all of them; the tray's libayatana-appindicator3
# (and its libayatana-indicator, ayatana-ido and libdbusmenu-gtk3) is not in
# the runtime and is built as modules below.
#
#   build/linux/flatpak/build.sh    # builds and installs --user
#
# The Widevine CDM is never part of the Flatpak: Sona downloads it from
# Google at runtime into its own data directory.
#
# GStreamer comes from the runtime, with the base, good, bad and libav plugin
# sets the deb, rpm and Arch packages depend on (docs/flatpak.md, "Audio").
id: dev.coredev.Sona
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: sona
rename-icon: sona

finish-args:
  # Window and rendering (MyGo on GTK3 and EGL).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Apple Music API, licences, HLS segments, the sign-in loopback redirect.
  - --share=network
  # Audio from the CDM host child: pipewiresink first, pulsesink fallback.
  - --filesystem=xdg-run/pipewire-0
  - --socket=pulseaudio
  # MPRIS: Sona owns org.mpris.MediaPlayer2.sona, not the default
  # org.mpris.MediaPlayer2.dev.coredev.Sona.
  - --own-name=org.mpris.MediaPlayer2.sona
  # go-keyring speaks the Secret Service API directly; the Secret portal
  # does not implement it. Without this Sona uses its 0600 file fallback.
  - --talk-name=org.freedesktop.secrets
  # Track-change notifications (internal/desktop/notify) use the
  # notification server directly, not the portal.
  - --talk-name=org.freedesktop.Notifications
  # Tray icon (libayatana-appindicator3, StatusNotifierItem).
  - --talk-name=org.kde.StatusNotifierWatcher
  # The Widevine CDM needs no extra permission: Sona downloads it from
  # Google into its own data directory (internal/playback/cdm).

# The tray libraries' headers, docs, GObject introspection and static
# archives are build-time only.
cleanup:
  - '*.a'
  - '*.la'
  - /share/gtk-doc
  - /share/gir-1.0
  - /share/vala
  - /lib/girepository-1.0

modules:
  # Build-time only: libdbusmenu's configure wants intltool and dbus-glib, and
  # the GNOME SDK has neither (the same modules as flathub/shared-modules).
  - name: intltool
    cleanup: ['*']
    sources:
      - type: archive
        url: https://launchpad.net/intltool/trunk/0.51.0/+download/intltool-0.51.0.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd
      - type: patch
        path: patches/intltool-perl5.26-regex-fixes.patch

  - name: dbus-glib
    config-opts: [--disable-static, --disable-gtk-doc]
    sources:
      - type: archive
        url: https://dbus.freedesktop.org/releases/dbus-glib/dbus-glib-0.116.tar.gz
        sha256: e3f3d4487e2883800770ed5899ed111bdc4ba7056af34a255c4c46ad8a2486f3
    cleanup: ['*.la', '/bin', '/etc', '/include', '/lib/pkgconfig', '/libexec', '/share/gtk-doc', '/share/man']

  - name: libdbusmenu
    buildsystem: autotools
    build-options:
      # As flathub/shared-modules: the 2016 sources do not build with -Werror,
      # and configure.ac leaves HAVE_VALGRIND undefined without valgrind.
      cflags: -Wno-error
      env:
        HAVE_VALGRIND_FALSE: '#'
        HAVE_VALGRIND_TRUE: ''
    config-opts:
      - --with-gtk=3
      - --disable-gtk-doc
      - --disable-tests
      - --disable-dumper
      - --disable-vala
      - --enable-introspection=no
    sources:
      - type: archive
        url: https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz
        sha256: b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a
    cleanup: ['/include', '/lib/pkgconfig', '/libexec', '/share/doc']

  - name: ayatana-ido
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=OFF
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_INTROSPECTION=OFF
      - -DENABLE_VALA_BINDINGS=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/ayatana-ido/archive/refs/tags/0.10.4.tar.gz
        sha256: bd59abd5f1314e411d0d55ce3643e91cef633271f58126be529de5fb71c5ab38
    cleanup: ['/include', '/lib/pkgconfig']

  - name: libayatana-indicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_TESTS=OFF
      - -DENABLE_LOADER=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz
        sha256: a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95
    cleanup: ['/include', '/lib/pkgconfig']

  - name: libayatana-appindicator
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_BINDINGS_MONO=OFF
      - -DENABLE_BINDINGS_VALA=OFF
      - -DENABLE_GTKDOC=OFF
      - -DENABLE_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/AyatanaIndicators/libayatana-appindicator/archive/refs/tags/0.5.94.tar.gz
        sha256: 884a6bc77994c0b58c961613ca4c4b974dc91aa0f804e70e92f38a542d0d0f90
    cleanup: ['/include', '/lib/pkgconfig']

  - name: sona
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/golang/bin
      env:
        CGO_ENABLED: '1'
        GOTOOLCHAIN: local
        GOSUMDB: 'off'
        GOFLAGS: -modcacherw
        GOMODCACHE: /run/build/sona/.gomodcache
        GOCACHE: /run/build/sona/.gocache
    sources:
      # The working tree (a Flathub build would use a git source at a tag).
      - type: dir
        path: ../../..
        skip: [.git, .devenv, .direnv, .task, bin, sona, build/linux/flatpak/.flatpak-builder]
      # Every Go module as a file in a GOPROXY=file:// tree, so the build needs
      # no network. Regenerate with gosources.go (docs/flatpak.md).
      - go-sources.json
    build-commands:
      # The flags build/ldflags.sh prints for Linux without credentials (the
      # sandbox has no network and no secrets, so it keeps its own copy).
      - >-
        GOPROXY=file://$PWD/go-proxy
        go build -tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false
        -ldflags "-w -s -X main.version=$(cat VERSION) -X github.com/egoist/mygo.production=1"
        -o /app/bin/sona ./cmd/sona
      - install -Dm644 build/linux/dev.coredev.Sona.desktop -t /app/share/applications
      - cp -a build/linux/icons /app/share/
      - install -Dm644 LICENSE internal/playback/widevine/LICENSE.chromium -t /app/share/doc/sona
      # The `sona` command's completions and manual page, from the built binary
      # (as build/linux/Taskfile.yml's package:cli task does).
      - /app/bin/sona completion bash | install -Dm644 /dev/stdin /app/share/bash-completion/completions/sona
      - /app/bin/sona completion zsh | install -Dm644 /dev/stdin /app/share/zsh/site-functions/_sona
      - /app/bin/sona completion fish | install -Dm644 /dev/stdin /app/share/fish/vendor_completions.d/sona.fish
      - /app/bin/sona help --man | gzip -9n | install -Dm644 /dev/stdin /app/share/man/man1/sona.1.gz
