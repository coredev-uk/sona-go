version: '3'

tasks:
  build:
    summary: Builds the application for Linux (MyGo on GTK3)
    cmds:
      # Silent: the flags carry the Last.fm API secret. build/ldflags.sh reads
      # it (and the key and the Discord application ID) from SONA_LASTFM_KEY /
      # SONA_LASTFM_SECRET / SONA_DISCORD_CLIENT_ID when set (CI: repo
      # secrets), so no logged command line ever holds it. -X main.version
      # carries VERSION into the binary (`sona --version`, Diagnostics, the
      # log).
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="$(VERSION={{.VERSION}} bash {{.ROOT_DIR}}/build/ldflags.sh --goos linux)" -o {{.OUTPUT}} ./cmd/sona
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      # -trimpath keeps -ldflags (and the credentials in them) out of the
      # binary's build info.
      BUILD_FLAGS: '-tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1

  package:
    summary: Packages a production build as .deb, .rpm, Arch package and AppImage (in bin/)
    description: |
      A binary built in devenv on NixOS links against /nix/store and runs
      only there: release packages need a build on a baseline distro
      (`release`, in a container).
    deps:
      - task: build
    cmds:
      - task: package:cli
      # nfpm names the file <-t target>, so FILE and EXT carry each format's
      # conventional file name (Arch's is .pkg.tar.zst, not nfpm's format name).
      - task: package:format
        vars: { FORMAT: deb, EXT: deb, FILE: 'sona_{{.VERSION}}_amd64' }
      - task: package:format
        vars: { FORMAT: rpm, EXT: rpm, FILE: 'sona-{{.VERSION}}-1.x86_64' }
      - task: package:format
        vars: { FORMAT: archlinux, EXT: pkg.tar.zst, FILE: 'sona-{{.VERSION}}-1-x86_64' }
      - task: create:appimage

  package:cli:
    summary: Writes the `sona` command's shell completions and manual page, generated by the built binary, into bin/cli (nfpm.yaml installs them)
    cmds:
      - mkdir -p {{.BIN_DIR}}/cli
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion bash > {{.BIN_DIR}}/cli/sona.bash'
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion zsh > {{.BIN_DIR}}/cli/_sona'
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion fish > {{.BIN_DIR}}/cli/sona.fish'
      - '{{.BIN_DIR}}/{{.APP_NAME}} help --man | gzip -9n > {{.BIN_DIR}}/cli/sona.1.gz'

  package:format:
    internal: true
    cmds:
      - go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1 package -p {{.FORMAT}} -f ./build/linux/nfpm/nfpm.yaml -t {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.FILE}}.{{.EXT}}
    env:
      GOARCH: amd64 # nfpm.yaml's arch
      SONA_VERSION: '{{.VERSION}}' # nfpm.yaml's version

  create:appimage:
    summary: Creates the AppImage from the built binary (downloads linuxdeploy and its GTK plugin on first use)
    cmds:
      - bash build/linux/appimage.sh {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}} {{.VERSION}}

  release:
    summary: Builds and smoke-tests all packages on Ubuntu 24.04 in podman/docker (into bin/release)
    cmds:
      - bash build/linux/release/release.sh

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
