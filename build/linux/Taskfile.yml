version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux (GTK4 + WebKitGTK 6)
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      # Silent: LDFLAGS may carry the Last.fm API secret.
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT}}
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      # A command-line -tags replaces the one in GOFLAGS (devenv's
      # -tags=sqlite_fts5), so production builds name sqlite_fts5 again.
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production,sqlite_fts5{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false{{end}}'
      # -X main.version carries VERSION into the binary (`sona --version`,
      # Diagnostics, the log). Production builds also compile in the
      # Last.fm API key and secret and the Discord application ID from
      # SONA_LASTFM_KEY / SONA_LASTFM_SECRET / SONA_DISCORD_CLIENT_ID when
      # set (CI: repo secrets); -trimpath keeps -ldflags out of the
      # binary's build info. Development builds (DEV=true) leave them out:
      # Go records -ldflags in the build info without -trimpath and Wails'
      # development "Build Info:" log line prints it; Sona reads the same
      # variables at runtime instead (devenv loads .env).
      LDFLAGS: '{{if ne .DEV "true"}}-w -s {{end}}-X main.version={{.VERSION}}{{if ne .DEV "true"}}{{if .SONA_LASTFM_KEY}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmKey={{.SONA_LASTFM_KEY}}{{end}}{{if .SONA_LASTFM_SECRET}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmSecret={{.SONA_LASTFM_SECRET}}{{end}}{{if .SONA_DISCORD_CLIENT_ID}} -X github.com/coredev-uk/sona-go/internal/discord.clientID={{.SONA_DISCORD_CLIENT_ID}}{{end}}{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1

  package:
    summary: Packages a production build as .deb, .rpm, Arch package and AppImage (in bin/)
    description: |
      Packages bundle the build machine's libraries and link paths: run this on
      the release baseline (`go tool wails3 task release`), not in devenv on NixOS.
    deps:
      - task: build
    cmds:
      # `wails3 tool package` names the file <-name>.<format>, so -name
      # carries each format's conventional file name.
      - task: package:format
        vars: { FORMAT: deb, FILE: 'sona_{{.VERSION}}_amd64' }
      - task: package:format
        vars: { FORMAT: rpm, FILE: 'sona-{{.VERSION}}-1.x86_64' }
      - task: package:format
        vars: { FORMAT: archlinux, FILE: 'sona-{{.VERSION}}-1-x86_64' }
      - task: create:appimage

  package:format:
    internal: true
    cmds:
      - go tool wails3 tool package -name "{{.FILE}}" -format {{.FORMAT}} -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/{{.BIN_DIR}}
    env:
      GOARCH: amd64 # nfpm.yaml's arch
      SONA_VERSION: '{{.VERSION}}' # nfpm.yaml's version

  create:appimage:
    summary: Creates the AppImage from the built binary (downloads linuxdeploy on first use)
    cmds:
      - bash build/linux/appimage.sh {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}} {{.VERSION}}

  release:
    summary: Builds and smoke-tests all packages on Ubuntu 24.04 in podman/docker (into bin/release)
    cmds:
      - bash build/linux/release/release.sh

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
