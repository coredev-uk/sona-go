version: '3'

tasks:
  build:
    summary: Builds the application for Linux (MyGo on GTK3)
    cmds:
      # Silent: LDFLAGS may carry the Last.fm API secret.
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT}} ./cmd/sona
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      BUILD_FLAGS: '-tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false'
      # -X main.version carries VERSION into the binary (`sona --version`,
      # Diagnostics, the log). Builds also compile in the Last.fm API key and
      # secret and the Discord application ID from SONA_LASTFM_KEY /
      # SONA_LASTFM_SECRET / SONA_DISCORD_CLIENT_ID when set (CI: repo
      # secrets); -trimpath keeps -ldflags out of the binary's build info.
      LDFLAGS: '-w -s -X main.version={{.VERSION}} -X github.com/egoist/mygo.production=1{{if .SONA_LASTFM_KEY}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmKey={{.SONA_LASTFM_KEY}}{{end}}{{if .SONA_LASTFM_SECRET}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmSecret={{.SONA_LASTFM_SECRET}}{{end}}{{if .SONA_DISCORD_CLIENT_ID}} -X github.com/coredev-uk/sona-go/internal/discord.clientID={{.SONA_DISCORD_CLIENT_ID}}{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: linux
      CGO_ENABLED: 1

  package:
    summary: Packages a production build as .deb, .rpm and Arch package (in bin/)
    description: |
      The AppImage returns with the phase 4 packaging PR. A binary built in
      devenv on NixOS links against /nix/store and runs only there: release
      packages need a build on a baseline distro.
    deps:
      - task: build
    cmds:
      - task: package:cli
      # nfpm names the file <-t target>, so FILE carries each format's
      # conventional file name.
      - task: package:format
        vars: { FORMAT: deb, FILE: 'sona_{{.VERSION}}_amd64' }
      - task: package:format
        vars: { FORMAT: rpm, FILE: 'sona-{{.VERSION}}-1.x86_64' }
      - task: package:format
        vars: { FORMAT: archlinux, FILE: 'sona-{{.VERSION}}-1-x86_64' }

  package:cli:
    summary: Writes the `sona` command's shell completions and manual page, generated by the built binary, into bin/cli (nfpm.yaml installs them)
    cmds:
      - mkdir -p {{.BIN_DIR}}/cli
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion bash > {{.BIN_DIR}}/cli/sona.bash'
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion zsh > {{.BIN_DIR}}/cli/_sona'
      - '{{.BIN_DIR}}/{{.APP_NAME}} completion fish > {{.BIN_DIR}}/cli/sona.fish'
      - '{{.BIN_DIR}}/{{.APP_NAME}} help --man | gzip -9n > {{.BIN_DIR}}/cli/sona.1.gz'

  package:format:
    internal: true
    cmds:
      - go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1 package -p {{.FORMAT}} -f ./build/linux/nfpm/nfpm.yaml -t {{.ROOT_DIR}}/{{.BIN_DIR}}/{{.FILE}}.{{.FORMAT}}
    env:
      GOARCH: amd64 # nfpm.yaml's arch
      SONA_VERSION: '{{.VERSION}}' # nfpm.yaml's version

  release:
    summary: Unavailable until the phase 4 packaging PR (fails fast); builds and smoke-tests all packages in podman/docker
    cmds:
      - bash build/linux/release/release.sh

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
