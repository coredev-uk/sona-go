# nfpm config for `task linux:package` (.deb, .rpm, Arch).
# https://nfpm.goreleaser.com
#
# Build release packages on the Ubuntu 24.04 baseline
# (build/linux/release/release.sh): a binary built in devenv links against
# /nix/store and runs only on NixOS.

name: "sona"
arch: ${GOARCH}
platform: "linux"
# VERSION, passed in by build/linux/Taskfile.yml (package:format).
version: "${SONA_VERSION}"
section: "sound"
priority: "optional"
maintainer: "Core <core@coredev.uk>"
description: |
  Apple Music for the Linux desktop.
  A native MyGo (GTK3) client with full-track playback through the
  Widevine CDM, which Sona downloads from Google at runtime (never
  bundled), GStreamer decoding and PipeWire/PulseAudio output, MPRIS
  media controls and music:// link handling.
vendor: "Sona"
homepage: "https://github.com/coredev-uk/sona-go"
license: "AGPL-3.0-only"
release: "1"

contents:
  - src: "./bin/sona"
    dst: "/usr/bin/sona"
    file_info:
      mode: 0755
  - src: "./build/linux/dev.coredev.Sona.desktop"
    dst: "/usr/share/applications/dev.coredev.Sona.desktop"
  - src: "./build/linux/icons/hicolor/16x16/apps/sona.png"
    dst: "/usr/share/icons/hicolor/16x16/apps/sona.png"
  - src: "./build/linux/icons/hicolor/22x22/apps/sona.png"
    dst: "/usr/share/icons/hicolor/22x22/apps/sona.png"
  - src: "./build/linux/icons/hicolor/24x24/apps/sona.png"
    dst: "/usr/share/icons/hicolor/24x24/apps/sona.png"
  - src: "./build/linux/icons/hicolor/32x32/apps/sona.png"
    dst: "/usr/share/icons/hicolor/32x32/apps/sona.png"
  - src: "./build/linux/icons/hicolor/48x48/apps/sona.png"
    dst: "/usr/share/icons/hicolor/48x48/apps/sona.png"
  - src: "./build/linux/icons/hicolor/64x64/apps/sona.png"
    dst: "/usr/share/icons/hicolor/64x64/apps/sona.png"
  - src: "./build/linux/icons/hicolor/128x128/apps/sona.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/sona.png"
  - src: "./build/linux/icons/hicolor/256x256/apps/sona.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/sona.png"
  - src: "./build/linux/icons/hicolor/512x512/apps/sona.png"
    dst: "/usr/share/icons/hicolor/512x512/apps/sona.png"
  - src: "./build/linux/icons/hicolor/scalable/apps/sona.svg"
    dst: "/usr/share/icons/hicolor/scalable/apps/sona.svg"
  # Licence notices: Sona is AGPL-3.0-only; the CDM interface header compiled
  # into the binary is Chromium's (BSD-3-Clause), whose notice must ship.
  - src: "./LICENSE"
    dst: "/usr/share/doc/sona/LICENSE"
  - src: "./internal/playback/widevine/LICENSE.chromium"
    dst: "/usr/share/doc/sona/LICENSE.chromium"
  # The `sona` command's shell completions and manual page, generated by
  # the built binary (build/linux/Taskfile.yml, package:cli).
  - src: "./bin/cli/sona.bash"
    dst: "/usr/share/bash-completion/completions/sona"
  - src: "./bin/cli/_sona"
    dst: "/usr/share/zsh/site-functions/_sona"
  - src: "./bin/cli/sona.fish"
    dst: "/usr/share/fish/vendor_completions.d/sona.fish"
  - src: "./bin/cli/sona.1.gz"
    dst: "/usr/share/man/man1/sona.1.gz"

# Runtime: GTK3 for the window (MyGo loads it, with its tray's appindicator,
# at run time); GStreamer core + base (appsrc, audioconvert, audioresample,
# volume) + good (autoaudiosink) + an AAC decoder (avdec_aac from libav) + a
# PipeWire or PulseAudio sink for the playback host; bad for the video
# parsers motion artwork and music videos use.
# The Widevine CDM is no dependency: Sona downloads it from Google at
# runtime and never ships it.
depends:
  - libgtk-3-0
  - libayatana-appindicator3-1
  - libgstreamer1.0-0
  - libgstreamer-plugins-base1.0-0
  - gstreamer1.0-plugins-base
  - gstreamer1.0-plugins-good
  - gstreamer1.0-plugins-bad
  - gstreamer1.0-libav
  - gstreamer1.0-pipewire | gstreamer1.0-pulseaudio
recommends:
  - gstreamer1.0-pipewire

overrides:
  rpm:
    # Fedora; pulsesink ships in gstreamer1-plugins-good there.
    # gstreamer1-plugin-libav is in Fedora proper since 41 (RPM Fusion before).
    # gstreamer1-plugins-bad-free carries the video parsers.
    depends:
      - gtk3
      - libayatana-appindicator-gtk3
      - gstreamer1
      - gstreamer1-plugins-base
      - gstreamer1-plugins-good
      - gstreamer1-plugins-bad-free
      - gstreamer1-plugin-libav
    recommends:
      - pipewire-gstreamer
  archlinux:
    # nfpm's Arch packager writes depends only (no optdepends), so the
    # gst-plugin-pipewire recommendation does not carry over.
    depends:
      - gtk3
      - libayatana-appindicator
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-plugins-bad
      - gst-libav

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postinstall.sh"
