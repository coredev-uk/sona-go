version: '3'

# macOS development builds: a plain bin/sona, no .app
# bundle, no signing, no packaging. The flags are build/linux/Taskfile.yml's;
# keep them in step.

tasks:
  build:
    summary: Builds the application for macOS (MyGo on AppKit; unsigned, unbundled)
    cmds:
      # Silent: LDFLAGS may carry the Last.fm API secret.
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT}} ./cmd/sona
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      BUILD_FLAGS: '-tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false'
      LDFLAGS: '-w -s -X main.version={{.VERSION}} -X github.com/egoist/mygo.production=1{{if .MACOSX_DEPLOYMENT_TARGET}} -extldflags=-mmacosx-version-min={{.MACOSX_DEPLOYMENT_TARGET}}{{end}}{{if .SONA_LASTFM_KEY}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmKey={{.SONA_LASTFM_KEY}}{{end}}{{if .SONA_LASTFM_SECRET}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmSecret={{.SONA_LASTFM_SECRET}}{{end}}{{if .SONA_DISCORD_CLIENT_ID}} -X github.com/coredev-uk/sona-go/internal/discord.clientID={{.SONA_DISCORD_CLIENT_ID}}{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
