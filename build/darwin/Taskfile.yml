version: '3'

# macOS development builds: a plain bin/sona, no .app
# bundle, no signing, no packaging. The flags are build/ldflags.sh's, as the
# Linux build's.

tasks:
  build:
    summary: Builds the application for macOS (MyGo on AppKit; unsigned, unbundled)
    cmds:
      # Silent: the flags carry the Last.fm API secret. build/ldflags.sh reads
      # it from the environment, so no logged command line ever holds it.
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="$(VERSION={{.VERSION}} bash {{.ROOT_DIR}}/build/ldflags.sh --goos darwin)" -o {{.OUTPUT}} ./cmd/sona
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      BUILD_FLAGS: '-tags mygo_noinspector,sqlite_fts5 -trimpath -buildvcs=false'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
