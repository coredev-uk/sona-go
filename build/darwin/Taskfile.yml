version: '3'

# macOS development builds: a plain bin/sona, no .app
# bundle, no signing, no packaging. The flags are build/linux/Taskfile.yml's;
# keep them in step.

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for macOS (Cocoa + WebKit from the SDK; unsigned, unbundled)
    deps:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    cmds:
      # Silent: LDFLAGS may carry the Last.fm API secret.
      - cmd: go build {{.BUILD_FLAGS}} -ldflags="{{.LDFLAGS}}" -o {{.OUTPUT}}
        silent: true
      - echo "built {{.OUTPUT}} ({{.VERSION}})"
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production,sqlite_fts5{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false{{end}}'
      LDFLAGS: '{{if ne .DEV "true"}}-w -s {{end}}-X main.version={{.VERSION}}{{if .SONA_LASTFM_KEY}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmKey={{.SONA_LASTFM_KEY}}{{end}}{{if .SONA_LASTFM_SECRET}} -X github.com/coredev-uk/sona-go/internal/scrobble.lastfmSecret={{.SONA_LASTFM_SECRET}}{{end}}{{if .SONA_DISCORD_CLIENT_ID}} -X github.com/coredev-uk/sona-go/internal/discord.clientID={{.SONA_DISCORD_CLIENT_ID}}{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1

  run:
    summary: Runs the built binary
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
