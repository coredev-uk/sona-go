# devenv 2.4 or newer (`devenv version`); an older CLI refuses this project.
require_version: ">=2.4.0"
inputs:
  # Pinned nixos-unstable revision (2026-10-27): Go, Node, GTK4, WebKitGTK and
  # GStreamer change only when this line does. To bump it, take the current
  # nixos-unstable head (`git ls-remote https://github.com/NixOS/nixpkgs
  # refs/heads/nixos-unstable`), put that revision here, run `devenv update`,
  # and commit both files after `check` and `test` pass (CONTRIBUTING.md).
  nixpkgs:
    url: github:NixOS/nixpkgs/31ecbaca1bdefa45dffc409f0250bd8039ea0010
  # devenv's modules, pinned to a main revision after v2.4.0. v2.4.0's Go
  # module rebuilds every Go tool with the project's Go, so gopls 0.24 (which
  # needs Go 1.27) fails to build and the rest lose the binary cache; main
  # keeps nixpkgs' builds. Move to the next release tag once it is out.
  devenv:
    url: github:cachix/devenv/0d6c556e5f862c14a75a543e2ee4fdb7acc005ad?dir=src/modules
